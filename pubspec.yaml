name: ezan_saati
description: "Ezan Saati ve İslami Rehber Uygulaması"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  adhan: ^2.0.0+1              # Namaz vakti hesaplama (internetsiz)
  geolocator: ^14.0.0          # GPS konumu
  shared_preferences: ^2.3.0   # Seçilen şehri hatırlama
  url_launcher: ^6.3.0         # Cami Bulucu için harita uygulamasını açma
  share_plus: ^13.3.0          # Ayet ve duaları telefonun paylaş menüsüyle paylaşma
  # Dua Çemberi ortak kullanım (Firebase ücretsiz Spark planı: anonim giriş + Firestore)
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  just_audio: ^0.10.6          # Kur'an: sûrelerin ayet ayet sesli okunuşu (internetten akış)
  hijri: ^3.0.1                # Hicrî takvim (Ümmü'l-Kurâ); Diyanet 2026-27 dinî günleriyle aynı
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  youtube_player_iframe: ^6.0.2
  workmanager: ^0.10.10
  play_install_referrer: ^0.5.0  # Grup bağlantısından Play Store'a gidip kuranlar ilk açılışta gruba yönlenir

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  fake_cloud_firestore: ^4.3.0 # Dua Çemberi eşitleme testleri (sunucusuz)

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/tiles/
    - assets/images/namaz/
    - assets/images/mesaj/
    - assets/images/zikir/
    - assets/images/kible/
    - assets/images/ikon/
    - assets/data/
    - assets/fonts/OFL.txt
    - assets/fonts/Lora-OFL.txt

  # Arapça metinler için (SIL Open Font License, bkz. assets/fonts/OFL.txt)
  fonts:
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
        - asset: assets/fonts/Lora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lora-Bold.ttf
          weight: 700
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
