name: ezan_saati
description: "Ezan Saati ve İslami Rehber Uygulaması"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  adhan: ^2.0.0+1              # Namaz vakti hesaplama (internetsiz)
  geolocator: ^14.0.0          # GPS konumu
  shared_preferences: ^2.3.0   # Seçilen şehri hatırlama
  url_launcher: ^6.3.0         # Cami Bulucu için harita uygulamasını açma

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/tiles/
