name: ezan_saati
description: "Ezan Saati ve İslami Rehber Uygulaması"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  adhan: ^2.0.0+1              # Namaz vakti hesaplama (internetsiz)
  geolocator: ^14.0.0          # GPS konumu
  shared_preferences: ^2.3.0   # Seçilen şehri hatırlama
  url_launcher: ^6.3.0         # Cami Bulucu için harita uygulamasını açma
  share_plus: ^13.3.0          # Ayet ve duaları telefonun paylaş menüsüyle paylaşma
  # Dua Çemberi ortak kullanım (Firebase ücretsiz Spark planı: anonim giriş + Firestore)
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  crypto: ^3.0.6               # Telefon numarasını sunucuya açık yazmadan eşleştirmek için özet
  just_audio: ^0.10.6          # İlahiler: uygulama içindeki ses kayıtlarını çalma
  hijri: ^3.0.1                # Hicrî takvim (Ümmü'l-Kurâ); Diyanet 2026-27 dinî günleriyle aynı

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  fake_cloud_firestore: ^4.3.0 # Dua Çemberi eşitleme testleri (sunucusuz)

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/tiles/
    - assets/images/namaz/
    - assets/images/mesaj/
    - assets/images/zikir/
    - assets/images/kible/
    - assets/data/
    - assets/audio/ilahiler/
    - assets/fonts/OFL.txt

  # Arapça metinler için (SIL Open Font License, bkz. assets/fonts/OFL.txt)
  fonts:
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
