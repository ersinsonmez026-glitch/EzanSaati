name: İlahi kaynak araştırması (geçici)

# Geçici: açık arşivlerdeki ilahi kayıtlarının lisans bilgisini listeler.
# Hiçbir dosya indirmez, depoya yazmaz. İş bitince silinecek.
on:
  push:
    branches: [claude/charming-davinci-6c5fkr]
    paths: [.github/workflows/ilahi-arastirma.yml]

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Internet Archive, Freesound, Library of Congress
        shell: python
        run: |
          import json, re, time, urllib.parse, urllib.request
          UA = {'User-Agent': 'EzanSaatiLicenseCheck/1.2 (https://github.com/ersinsonmez026-glitch/EzanSaati; one-off license audit)'}
          def fetch(url):
              time.sleep(2)
              try:
                  return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60).read().decode('utf-8', 'replace')
              except Exception as e:
                  print('HATA', url[:90], e); return ''
          print('=== INTERNET ARCHIVE ===')
          q = '(ilahi OR ilahiler OR ilahisi OR "Yunus Emre" OR tasavvuf OR "tasavvuf musikisi" OR mevlevi) AND mediatype:(audio)'
          url = 'https://archive.org/advancedsearch.php?' + urllib.parse.urlencode(
              {'q': q, 'fl[]': ['identifier', 'title', 'licenseurl', 'creator', 'uploader', 'rights'], 'rows': 300, 'output': 'json'}, doseq=True)
          r = fetch(url)
          docs = json.loads(r)['response']['docs'] if r else []
          print('IA toplam:', len(docs))
          for d in docs:
              lic = d.get('licenseurl', '')
              print(json.dumps({'id': d.get('identifier'), 'title': str(d.get('title'))[:90], 'lic': lic,
                                'creator': str(d.get('creator', ''))[:60], 'rights': str(d.get('rights', ''))[:80]}, ensure_ascii=False))
          print('=== FREESOUND ===')
          for term in ['ilahi', 'sufi', 'islamic hymn', 'nasheed', 'zikr', 'dhikr', 'mevlevi', 'ney']:
              h = fetch('https://freesound.org/search/?' + urllib.parse.urlencode({'q': term}))
              ids = list(dict.fromkeys(re.findall(r'/people/[^/]+/sounds/(\d+)/', h)))[:30]
              print(f'FS "{term}":', len(ids))
              for sid in ids:
                  p = fetch(f'https://freesound.org/s/{sid}/')
                  title = (re.search(r'<title>(.*?)</title>', p, re.S) or [None, ''])[1].strip()[:90]
                  lic = (re.search(r'creativecommons\.org/[a-z/.0-9]+', p) or [''])[0]
                  print(json.dumps({'fs': sid, 'title': title, 'lic': lic}, ensure_ascii=False))
          print('=== LIBRARY OF CONGRESS ===')
          for term in ['ilahi', 'sufi music turkey', 'turkish religious music']:
              r = fetch('https://www.loc.gov/audio/?' + urllib.parse.urlencode({'q': term, 'fo': 'json', 'c': 50}))
              res = json.loads(r).get('results', []) if r else []
              print(f'LOC "{term}":', len(res))
              for x in res:
                  print(json.dumps({'loc': x.get('id'), 'title': str(x.get('title'))[:90],
                                    'rights': str(x.get('rights') or x.get('rights_advisory') or '')[:120]}, ensure_ascii=False))
