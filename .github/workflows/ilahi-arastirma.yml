name: İlahi kaynak araştırması (geçici)

# Geçici: açık arşivlerdeki ilahi kayıtlarının lisans ve kaynak bilgisini listeler.
# Hiçbir dosya indirmez, depoya yazmaz. İş bitince silinecek.
on:
  push:
    branches: [claude/charming-davinci-6c5fkr]
    paths: [.github/workflows/ilahi-arastirma.yml]

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Geniş arama
        shell: python
        run: |
          import json, re, time, html, urllib.parse, urllib.request
          UA = {'User-Agent': 'EzanSaatiLicenseCheck/1.3 (https://github.com/ersinsonmez026-glitch/EzanSaati; one-off license audit)'}
          def fetch(url, t=2):
              time.sleep(t)
              try: return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60).read().decode('utf-8', 'replace')
              except Exception as e: print('HATA', url[:100], e); return ''
          def P(**k): print(json.dumps(k, ensure_ascii=False))
          # ---------- Freesound ----------
          print('=== FREESOUND ===')
          ids = {}
          for term in ['ilahi', 'ilahiler', 'zikir', 'zikr', 'dhikr', 'nasheed', 'nashid', 'anasheed', 'naat', 'mevlid',
                       'mawlid', 'salawat', 'salavat', 'qasida', 'kaside', 'sufi', 'sama sufi', 'tekbir', 'takbir',
                       'eid takbir', 'la ilaha illallah', 'islamic song', 'islamic chant', 'muslim chant', 'madih', 'hymn allah']:
              h = fetch('https://freesound.org/search/?' + urllib.parse.urlencode({'q': term}))
              for sid in re.findall(r'/people/[^/]+/sounds/(\d+)/', h): ids.setdefault(sid, term)
          print('FS aday:', len(ids))
          for sid, term in ids.items():
              p = fetch(f'https://freesound.org/s/{sid}/', 1)
              og = lambda n: html.unescape((re.search(rf'<meta property="og:{n}" content="(.*?)"', p, re.S) or [None, ''])[1])
              lic = (re.search(r'creativecommons\.org/[a-z/.0-9]+', p) or [''])[0]
              dur = (re.search(r'(\d+:\d\d(?:\.\d+)?)\s*</', p) or [None, ''])[1]
              tags = re.findall(r'/browse/tags/([^/"]+)/', p)[:12]
              P(fs=sid, q=term, title=og('title')[:90], lic=lic, dur=dur, desc=og('description')[:300], tags=tags)
          # ---------- Internet Archive (yalnız lisans beyanı olanlar) ----------
          print('=== INTERNET ARCHIVE ===')
          terms = ['ilahi', 'ilahiler', 'ilahisi', 'zikir', 'zikrullah', 'nasheed', 'nashid', 'anasheed', 'naat', 'mevlid',
                   'mawlid', 'salawat', 'salavat', 'qasida', 'kaside', 'sufi', 'tasavvuf', 'tekbir', 'takbir', 'ilahi grubu']
          q = '(' + ' OR '.join(f'"{t}"' for t in terms) + ') AND mediatype:(audio) AND licenseurl:*'
          r = fetch('https://archive.org/advancedsearch.php?' + urllib.parse.urlencode(
              {'q': q, 'fl[]': ['identifier', 'title', 'licenseurl', 'creator', 'uploader', 'description'], 'rows': 400, 'output': 'json'}, doseq=True))
          docs = json.loads(r)['response']['docs'] if r else []
          print('IA lisanslı:', len(docs))
          for d in docs:
              desc = re.sub(r'<[^>]+>', ' ', str(d.get('description', '')))
              P(ia=d.get('identifier'), title=str(d.get('title'))[:100], lic=d.get('licenseurl'), creator=str(d.get('creator', ''))[:70],
                uploader=str(d.get('uploader', ''))[:40], desc=re.sub(r'\s+', ' ', desc)[:220])
          # ---------- ccMixter ----------
          print('=== CCMIXTER ===')
          for term in ['nasheed', 'islamic', 'sufi', 'ilahi', 'dhikr', 'arabic chant']:
              r = fetch('http://ccmixter.org/api/query?' + urllib.parse.urlencode({'search': term, 'f': 'json', 'limit': 30}))
              try: items = json.loads(r) if r else []
              except Exception: items = []
              print(f'CC "{term}":', len(items))
              for it in items:
                  P(cc=it.get('upload_id'), title=str(it.get('upload_name'))[:80], artist=it.get('user_name'), lic=it.get('license_url'),
                    tags=str(it.get('upload_tags'))[:120])
          # ---------- Free Music Archive ----------
          print('=== FMA ===')
          for term in ['nasheed', 'sufi', 'ilahi', 'islamic', 'dhikr', 'qawwali']:
              h = fetch('https://freemusicarchive.org/search?' + urllib.parse.urlencode({'adv': 1, 'quicksearch': term}))
              tr = re.findall(r'data-track-info=\'(\{.*?\})\'', h) or re.findall(r'data-track-info="(\{.*?\})"', h)
              print(f'FMA "{term}":', len(tr))
              for t in tr[:25]:
                  try: j = json.loads(html.unescape(t))
                  except Exception: continue
                  P(fma=j.get('id'), title=str(j.get('title'))[:80], artist=j.get('artistName'), url=j.get('url'))
