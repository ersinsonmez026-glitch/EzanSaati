name: Ezan sesi adayları (geçici)

# Geçici: Wikimedia Commons'ta serbest lisanslı (CC0 / CC-BY / CC-BY-SA) ezan kayıtlarını arar, en fazla 6
# tanesini dinlenebilir mp3'e çevirip .ezan_adaylari/ klasörüne ekler. Seçimden sonra klasör ve bu dosya silinecek.
on:
  push:
    branches: [claude/charming-davinci-6c5fkr]
    paths: [.github/workflows/ezan-adaylari.yml]

permissions:
  contents: write

jobs:
  adaylar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/charming-davinci-6c5fkr
      - name: ffmpeg
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Ara, lisansı denetle, indir, çevir
        shell: python
        run: |
          import json, re, subprocess, urllib.request, urllib.parse, os, html
          UA = {'User-Agent': 'EzanSaati/1.0 (github.com/ersinsonmez026-glitch/EzanSaati)'}
          def api(params):
              q = 'https://commons.wikimedia.org/w/api.php?' + urllib.parse.urlencode({**params, 'format': 'json'})
              return json.load(urllib.request.urlopen(urllib.request.Request(q, headers=UA), timeout=60))
          titles = []
          for term in ['adhan', 'azan', 'ezan', 'athan', 'call to prayer', 'adhan recitation', 'muezzin']:
              d = api({'action': 'query', 'list': 'search', 'srnamespace': 6, 'srlimit': 50,
                       'srsearch': term + ' filetype:audio'})
              for r in d['query']['search']:
                  if r['title'] not in titles:
                      titles.append(r['title'])
          print('Bulunan ses dosyası:', len(titles))
          ok = []
          for i in range(0, len(titles), 40):
              d = api({'action': 'query', 'prop': 'imageinfo', 'iiprop': 'url|size|mime|extmetadata',
                       'titles': '|'.join(titles[i:i + 40])})
              for p in d['query']['pages'].values():
                  if 'imageinfo' not in p:
                      continue
                  ii = p['imageinfo'][0]; m = ii.get('extmetadata', {})
                  v = lambda k: html.unescape(re.sub('<[^>]+>', '', str((m.get(k) or {}).get('value', '')))).strip()
                  lic = v('License').lower(); short = v('LicenseShortName')
                  good = lic.startswith('cc0') or lic.startswith('pd') or lic.startswith('cc-by')
                  print(('UYGUN ' if good else 'ELENDİ'), p['title'], '|', short, '|', v('Artist')[:60], '|', ii['size'])
                  if good and 150_000 < ii['size'] < 40_000_000:
                      ok.append((p['title'], ii['url'], short, v('Artist')[:80], v('ImageDescription')[:160]))
          os.makedirs('.ezan_adaylari', exist_ok=True)
          rows = []
          n = 0
          for title, url, short, artist, desc in ok:
              if n >= 6:
                  break
              try:
                  data = urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=120).read()
              except Exception as e:
                  print('İNDİRİLEMEDİ', title, e); continue
              open('kaynak', 'wb').write(data)
              dur = subprocess.run(['ffprobe', '-v', 'error', '-show_entries', 'format=duration', '-of', 'csv=p=0', 'kaynak'],
                                   capture_output=True, text=True).stdout.strip()
              try:
                  dur = float(dur)
              except ValueError:
                  print('OKUNAMADI', title); continue
              # Ezan 1-6 dakika sürer; çok kısa/uzun kayıtlar (dua, hutbe, parça) elenir.
              if not 60 <= dur <= 400:
                  print('SÜRE UYGUN DEĞİL', title, round(dur)); continue
              n += 1
              ad = re.sub(r'[^A-Za-z0-9]+', '_', title.split(':', 1)[1].rsplit('.', 1)[0]).strip('_')[:40]
              out = f'.ezan_adaylari/{n}_{ad}.mp3'
              subprocess.run(['ffmpeg', '-v', 'error', '-y', '-i', 'kaynak', '-af', 'loudnorm=I=-16:TP=-1.5:LRA=11',
                              '-ac', '1', '-ar', '44100', '-c:a', 'libmp3lame', '-b:a', '56k', out], check=True)
              rows.append(f'{n}. {title}\n   Süre: {int(dur // 60)} dk {int(dur % 60)} sn · Lisans: {short} · '
                          f'Kaynak: {artist}\n   Açıklama: {desc}\n   {url}\n')
              print('HAZIR', out, round(dur), 'sn', os.path.getsize(out), 'bayt')
          open('.ezan_adaylari/LISTE.txt', 'w').write('\n'.join(rows))
          print(open('.ezan_adaylari/LISTE.txt').read())
      - name: Dala ekle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ezan_adaylari
          git commit -m "Geçici: dinlemek için ezan sesi adayları (Wikimedia Commons, serbest lisans)"
          git push origin HEAD:claude/charming-davinci-6c5fkr
