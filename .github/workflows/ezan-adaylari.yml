name: Ezan sesi adayları (geçici)

# Geçici: lisansı temiz görünen adayların açıklama sayfalarını alır; kesim noktalarını belirlemek için ses zarfı ve
# spektrogram görsellerini .ezan_adaylari/analiz/ klasörüne ekler. Seçimden sonra klasör ve bu dosya silinecek.
on:
  push:
    branches: [claude/charming-davinci-6c5fkr]
    paths: [.github/workflows/ezan-adaylari.yml]

permissions:
  contents: write

jobs:
  analiz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/charming-davinci-6c5fkr
      - name: Araçlar
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q numpy pillow
      - name: Sayfalar ve analiz
        shell: python
        run: |
          import json, subprocess, urllib.request, urllib.parse, os, time, wave
          import numpy as np
          from PIL import Image, ImageDraw
          UA = {'User-Agent': 'EzanSaati/1.0 (github.com/ersinsonmez026-glitch/EzanSaati; ezan bildirimi icin ses secimi)'}
          out = '.ezan_adaylari/analiz'
          os.makedirs(out, exist_ok=True)
          for f in os.listdir(out):
              if f.endswith('.wav'): os.remove(os.path.join(out, f))
          files = {'3': 'File:Beautiful adhan.ogg', '4': 'File:The Adhan - Muslim Call to Prayer - Aaqib Azeez.mp3',
                   '5': 'File:Call to prayer.ogg', '7': 'File:Adhan.ogg', '8': 'File:Athan during Ramadan 2.wav',
                   '9': 'File:Athan in Ramadan.wav', '10': 'File:Azan.ogg', '12': 'File:Islamic call to worship.oga',
                   '13': 'File:Llamada a oración Mezquita Hassan II.wav'}
          def get(url):
              for wait in (0, 20, 45, 90):
                  time.sleep(wait)
                  try:
                      return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=120).read()
                  except urllib.error.HTTPError as e:
                      if e.code != 429: raise
              raise RuntimeError('çok istek')
          q = ('https://commons.wikimedia.org/w/api.php?format=json&action=query&prop=revisions|imageinfo'
               '&rvprop=content&rvslots=main&iiprop=url&titles=' + urllib.parse.quote('|'.join(files.values())))
          pages = {p['title']: p for p in json.loads(get(q))['query']['pages'].values()}
          def spec(x, sr, a, b, path, w=1600):
              x = x[int(a * sr):int(b * sr)]; N = 512; hop = max(80, len(x) // (w * 2))
              fr = np.array([np.abs(np.fft.rfft(x[i:i + N] * np.hanning(N)))[:200] for i in range(0, len(x) - N, hop)])
              db = np.clip((20 * np.log10(fr + 1e-6) + 80) / 80, 0, 1)
              im = Image.fromarray((255 * db.T[::-1]).astype(np.uint8)).resize((w, 220)).convert('RGB')
              d = ImageDraw.Draw(im); step = 1 if b - a <= 20 else 5
              for t in range(int(a), int(b) + 1, step):
                  X = (t - a) / (b - a) * w; d.line([(X, 205), (X, 220)], fill=(255, 0, 0)); d.text((X + 2, 206), str(t), fill=(255, 90, 90))
              im.save(path)
          for n, t in files.items():
              p = pages[t]
              open(f'{out}/{n}_sayfa.txt', 'w').write(p['revisions'][0]['slots']['main']['*'])
              time.sleep(6)
              url = p['imageinfo'][0]['url']; ext = url.rsplit('.', 1)[1]
              open('k.' + ext, 'wb').write(get(url))
              subprocess.run(['ffmpeg', '-v', 'error', '-y', '-i', 'k.' + ext, '-ac', '1', '-ar', '16000', '-c:a', 'pcm_s16le', 'k.wav'], check=True)
              w = wave.open('k.wav'); sr = w.getframerate()
              x = np.frombuffer(w.readframes(w.getnframes()), np.int16).astype(float) / 32768; L = len(x) / sr
              hop = sr // 4
              rms = [20 * np.log10(np.sqrt(np.mean(x[i:i + hop] ** 2)) + 1e-9) for i in range(0, len(x), hop)]
              s = ''.join(' ' if r < -50 else '.' if r < -35 else ':' if r < -25 else '|' for r in rms)
              env = [f'{i / 4:6.1f}s {s[i:i + 80]}' for i in range(0, len(s), 80)]
              open(f'{out}/{n}_zarf.txt', 'w').write(f'süre {L:.2f} sn\n' + '\n'.join(env) + '\n')
              spec(x, sr, 0, L, f'{out}/{n}_tum.png')
              spec(x, sr, 0, min(16, L), f'{out}/{n}_bas.png')
              spec(x, sr, max(0, L - 16), L, f'{out}/{n}_son.png')
              print(n, t, round(L, 1))
      - name: Dala ekle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q -r --cached --ignore-unmatch .ezan_adaylari/analiz/*.wav .ezan_adaylari/kaynak
          rm -rf .ezan_adaylari/kaynak
          git add -A .ezan_adaylari
          git commit -m "Geçici: temiz ezan adaylarının analizi"
          git push origin HEAD:claude/charming-davinci-6c5fkr
