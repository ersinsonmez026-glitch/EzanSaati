name: Ezan sesi adayları (geçici)

# Geçici: Wikimedia Commons'ta Türkiye'de kaydedilmiş ezanları arar; lisansı ve kaynağı (yükleyenin kendi kaydı mı)
# denetler, uygun olanları dinlenebilir mp3 olarak .ezan_adaylari/turk/ klasörüne ekler. Seçimden sonra silinecek.
on:
  push:
    branches: [claude/charming-davinci-6c5fkr]
    paths: [.github/workflows/ezan-adaylari.yml]

permissions:
  contents: write

jobs:
  ara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/charming-davinci-6c5fkr
      - name: ffmpeg
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Türkiye ezanlarını ara ve denetle
        shell: python
        run: |
          import json, re, subprocess, urllib.request, urllib.parse, os, time
          UA = {'User-Agent': 'EzanSaati/1.0 (github.com/ersinsonmez026-glitch/EzanSaati; ezan bildirimi icin ses secimi)'}
          API = 'https://commons.wikimedia.org/w/api.php?format=json&'
          out = '.ezan_adaylari/turk'
          os.makedirs(out, exist_ok=True)
          def get(url):
              for wait in (0, 20, 45, 90, 120):
                  time.sleep(wait)
                  try:
                      return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=120).read()
                  except urllib.error.HTTPError as e:
                      if e.code != 429:
                          raise
              raise RuntimeError('çok istek')
          def api(params):
              time.sleep(1.5)
              return json.loads(get(API + urllib.parse.urlencode(params)))
          AUDIO = re.compile(r'\.(ogg|oga|opus|mp3|wav|flac|webm)$', re.I)
          found = set()
          # 1) Kategoriler (alt kategorilerle, 2 kat)
          seen_cats = set()
          def walk(cat, depth):
              if cat in seen_cats: return
              seen_cats.add(cat)
              cont = {}
              while True:
                  d = api({'action': 'query', 'list': 'categorymembers', 'cmtitle': cat, 'cmlimit': 500, 'cmtype': 'file|subcat', **cont})
                  for m in d['query']['categorymembers']:
                      if m['ns'] == 6 and AUDIO.search(m['title']): found.add(m['title'])
                      elif m['ns'] == 14 and depth > 0: walk(m['title'], depth - 1)
                  if 'continue' not in d: break
                  cont = d['continue']
          for c in ['Category:Adhan', 'Category:Adhan in Turkey', 'Category:Ezan', 'Category:Muezzins',
                    'Category:Audio files of Turkey', 'Category:Sounds of Istanbul', 'Category:Audio files of Istanbul',
                    'Category:Sounds of Turkey', 'Category:Audio files about Islam']:
              try: walk(c, 2)
              except Exception as e: print('kategori hatası', c, e)
          # 2) Arama
          for q in ['ezan', 'ezan istanbul', 'ezanı', 'adhan istanbul', 'adhan turkey', 'call to prayer istanbul',
                    'call to prayer turkey', 'azan istanbul', 'minaret istanbul', 'camii ezan', 'mosque istanbul sound',
                    'call to prayer mosque', 'adhan', 'müezzin', 'muezzin']:
              try:
                  d = api({'action': 'query', 'list': 'search', 'srsearch': q + ' filetype:audio', 'srnamespace': 6, 'srlimit': 100})
                  for m in d['query']['search']:
                      if AUDIO.search(m['title']): found.add(m['title'])
              except Exception as e: print('arama hatası', q, e)
          found = sorted(found)
          print(len(found), 'ses dosyası bulundu')
          # 3) Ayrıntılar
          info = {}
          for i in range(0, len(found), 40):
              d = api({'action': 'query', 'prop': 'revisions|imageinfo|categories', 'rvprop': 'content', 'rvslots': 'main',
                       'iiprop': 'url|size|extmetadata|mediatype', 'cllimit': 500, 'titles': '|'.join(found[i:i + 40])})
              for p in d['query']['pages'].values():
                  if 'imageinfo' in p: info[p['title']] = p
          TR = re.compile(r'turk|türk|istanbul|İstanbul|ankara|izmir|bursa|konya|antalya|edirne|trabzon|kapadokya|cappadocia|'
                          r'göreme|goreme|sultanahmet|süleymaniye|suleymaniye|eyüp|eyup|üsküdar|uskudar|fatih|kadıköy|kadikoy|'
                          r'beyoğlu|beyoglu|ezan|camii|cami\b|selimiye|mardin|diyarbak|şanlıurfa|sanliurfa|kayseri|safranbolu|'
                          r'bodrum|fethiye|alanya|side\b|kas\b|kaş|marmaris|pamukkale|selçuk|selcuk|efes|ephesus|bosphorus|boğaz', re.I)
          ok_lic = ('cc0', 'cc-by', 'cc by', 'public domain', 'pd')
          rows, dl = [], []
          for t, p in info.items():
              ii = p['imageinfo'][0]; m = ii.get('extmetadata', {})
              v = lambda k: re.sub('<[^>]+>', '', str((m.get(k) or {}).get('value', ''))).strip()
              text = p['revisions'][0]['slots']['main']['*'] if 'revisions' in p else ''
              cats = ' '.join(c['title'] for c in p.get('categories', []))
              hay = t + ' ' + text + ' ' + cats
              tr = bool(TR.search(hay))
              src = re.search(r'\|\s*source\s*=([^\n|]*(\{\{[^}]*\}\})?[^\n|]*)', text, re.I)
              src = src.group(1).strip() if src else ''
              own = bool(re.search(r'\{\{\s*own', src, re.I)) or bool(re.search(r'\{\{\s*self\s*\|', text, re.I))
              lic = v('LicenseShortName')
              licok = lic.lower().startswith(ok_lic) and not re.search(r'PD-Old|PD-US|PD-because|PD-ineligible|PD-textlogo', text, re.I)
              row = {'title': t, 'tr': tr, 'own': own, 'lic': lic, 'licok': licok, 'source': src[:200], 'artist': v('Artist')[:100],
                     'desc': v('ImageDescription')[:300], 'dur': ii.get('duration'), 'url': ii['url'].split('?')[0], 'cats': cats[:400]}
              rows.append(row)
              if tr and own and licok:
                  dl.append((row, text))
          json.dump(rows, open(f'{out}/TUM_SONUCLAR.json', 'w'), ensure_ascii=False, indent=1)
          print(len(rows), 'kayıt;', sum(r['tr'] for r in rows), 'Türkiye ile ilgili;', len(dl), 'Türkiye + kendi kaydı + temiz lisans')
          # 4) Uygun olanları indir
          n = 0; liste = []
          for row, text in sorted(dl, key=lambda x: x[0]['title']):
              if n >= 16: break
              time.sleep(8)
              try: data = get(row['url'])
              except Exception as e: print('İNDİRİLEMEDİ', row['title'], e); continue
              ext = row['url'].rsplit('.', 1)[1]
              open('kaynak.' + ext, 'wb').write(data)
              dur = subprocess.run(['ffprobe', '-v', 'error', '-show_entries', 'format=duration', '-of', 'csv=p=0', 'kaynak.' + ext],
                                   capture_output=True, text=True).stdout.strip()
              try: dur = float(dur)
              except ValueError: print('okunamadı', row['title']); continue
              if not 25 <= dur <= 600: print('süre uygun değil', round(dur), row['title']); continue
              n += 1
              ad = re.sub(r'[^A-Za-z0-9]+', '_', row['title'].split(':', 1)[1].rsplit('.', 1)[0]).strip('_')[:40]
              subprocess.run(['ffmpeg', '-v', 'error', '-y', '-i', 'kaynak.' + ext, '-af', 'loudnorm=I=-16:TP=-1.5:LRA=11',
                              '-ac', '1', '-ar', '44100', '-c:a', 'libmp3lame', '-b:a', '64k', f'{out}/T{n:02d}_{ad}.mp3'], check=True)
              open(f'{out}/T{n:02d}_sayfa.txt', 'w').write(text)
              liste.append(f"T{n:02d}. {row['title']}\n   Süre: {int(dur // 60)} dk {int(dur % 60)} sn · Lisans: {row['lic']} · "
                           f"Yazar: {row['artist']}\n   Kaynak: {row['source']}\n   Açıklama: {row['desc']}\n   {row['url']}\n")
          open(f'{out}/LISTE.txt', 'w').write('\n'.join(liste))
          print('\n'.join(liste))
          # İncelenecek diğer Türkiye kayıtları (kendi kaydı değil ya da lisans şüpheli)
          for r in rows:
              if r['tr'] and not (r['own'] and r['licok']):
                  print('ELENDİ:', r['title'], '|', r['lic'], '| kaynak:', r['source'][:80])
      - name: Dala ekle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .ezan_adaylari
          git commit -m "Geçici: Türkiye ezanı adayları"
          git push origin HEAD:claude/charming-davinci-6c5fkr
