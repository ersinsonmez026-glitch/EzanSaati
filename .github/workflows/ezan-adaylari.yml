name: Ezan sesi adayları (geçici)

# Geçici: seçilen 4, 6, 11 numaralı kayıtların orijinallerini ve açıklama sayfalarını indirir, analiz için
# 16 kHz mono WAV'a çevirip .ezan_adaylari/analiz/ klasörüne ekler. İş bitince klasör ve bu dosya silinecek.
on:
  push:
    branches: [claude/charming-davinci-6c5fkr]
    paths: [.github/workflows/ezan-adaylari.yml]

permissions:
  contents: write

jobs:
  analiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/charming-davinci-6c5fkr
      - name: ffmpeg
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Orijinalleri ve lisans sayfalarını indir
        shell: python
        run: |
          import json, subprocess, urllib.request, urllib.parse, os, time
          UA = {'User-Agent': 'EzanSaati/1.0 (github.com/ersinsonmez026-glitch/EzanSaati; ezan bildirimi icin ses secimi)'}
          os.makedirs('.ezan_adaylari/analiz', exist_ok=True)
          files = {'4': 'File:The Adhan - Muslim Call to Prayer - Aaqib Azeez.mp3',
                   '6': 'File:33937 ejaz215 call-to-prayer-from-the-prophet-s-mo.ogg',
                   '11': 'File:Call to prayer by Sabah Fakhry.mp3'}
          def get(url):
              for wait in (0, 20, 45, 90):
                  time.sleep(wait)
                  try:
                      return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=120).read()
                  except urllib.error.HTTPError as e:
                      if e.code != 429:
                          raise
              raise RuntimeError('çok istek')
          for n, t in files.items():
              q = ('https://commons.wikimedia.org/w/api.php?format=json&action=query&prop=revisions|imageinfo'
                   '&rvprop=content&rvslots=main&iiprop=url|extmetadata&titles=' + urllib.parse.quote(t))
              d = json.loads(get(q))
              p = next(iter(d['query']['pages'].values()))
              text = p['revisions'][0]['slots']['main']['*']
              open(f'.ezan_adaylari/analiz/{n}_sayfa.txt', 'w').write(
                  text + '\n\n---- extmetadata ----\n' + json.dumps(p['imageinfo'][0].get('extmetadata', {}), ensure_ascii=False, indent=1))
              time.sleep(8)
              ext = t.rsplit('.', 1)[1]
              open(f'kaynak_{n}.{ext}', 'wb').write(get(p['imageinfo'][0]['url']))
              subprocess.run(['ffprobe', '-hide_banner', f'kaynak_{n}.{ext}'], stderr=open(f'.ezan_adaylari/analiz/{n}_probe.txt', 'w'))
              subprocess.run(['ffmpeg', '-v', 'error', '-y', '-i', f'kaynak_{n}.{ext}', '-ac', '1', '-ar', '16000',
                              '-c:a', 'pcm_s16le', f'.ezan_adaylari/analiz/{n}.wav'], check=True)
              os.makedirs('.ezan_adaylari/kaynak', exist_ok=True)
              os.replace(f'kaynak_{n}.{ext}', f'.ezan_adaylari/kaynak/{n}.{ext}')
              time.sleep(8)
      - name: Dala ekle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .ezan_adaylari
          git commit -m "Geçici: seçilen ezan kayıtları, analiz için"
          git push origin HEAD:claude/charming-davinci-6c5fkr
