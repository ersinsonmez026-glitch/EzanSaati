name: Ezan sesi adayları (geçici)

# Geçici: Wikimedia Commons'ta serbest lisanslı (CC0 / CC-BY / CC-BY-SA) ezan kayıtlarını arar, en fazla 6
# tanesini dinlenebilir mp3'e çevirip .ezan_adaylari/ klasörüne ekler. Seçimden sonra klasör ve bu dosya silinecek.
on:
  push:
    branches: [claude/charming-davinci-6c5fkr]
    paths: [.github/workflows/ezan-adaylari.yml]

permissions:
  contents: write

jobs:
  adaylar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/charming-davinci-6c5fkr
      - name: ffmpeg
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: İkinci tur - belirli ezan kayıtları (yavaş indirme)
        shell: python
        run: |
          import json, re, subprocess, urllib.request, urllib.parse, os, html, time, glob
          UA = {'User-Agent': 'EzanSaati/1.0 (github.com/ersinsonmez026-glitch/EzanSaati; ezan bildirimi icin ses secimi)'}
          # Ezan olmayan (haber) kayıtları kaldır
          for f in glob.glob('.ezan_adaylari/1_*') + glob.glob('.ezan_adaylari/2_*'):
              os.remove(f)
          titles = ['File:Azan.ogg', 'File:Athan in Ramadan.wav', 'File:Athan during Ramadan 2.wav',
                    'File:Call to prayer by Sabah Fakhry.mp3', 'File:Islamic call to worship.oga',
                    'File:Llamada a oración Mezquita Hassan II.wav',
                    'File:33937 ejaz215 call-to-prayer-from-the-prophet-s-mo.ogg', 'File:Adhan.ogg']
          q = ('https://commons.wikimedia.org/w/api.php?format=json&action=query&prop=imageinfo'
               '&iiprop=url|size|extmetadata&titles=' + urllib.parse.quote('|'.join(titles)))
          d = json.load(urllib.request.urlopen(urllib.request.Request(q, headers=UA), timeout=60))
          rows = [open('.ezan_adaylari/LISTE.txt').read().split('\n\n', 2)[-1]] if os.path.exists('.ezan_adaylari/LISTE.txt') else []
          n = 5
          def get(url):
              for wait in (0, 20, 45, 90):
                  time.sleep(wait)
                  try:
                      return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=120).read()
                  except urllib.error.HTTPError as e:
                      if e.code != 429:
                          raise
                      print('  429, bekleniyor...')
              raise RuntimeError('çok istek')
          for p in d['query']['pages'].values():
              if 'imageinfo' not in p:
                  print('YOK', p.get('title')); continue
              ii = p['imageinfo'][0]; m = ii.get('extmetadata', {})
              v = lambda k: html.unescape(re.sub('<[^>]+>', '', str((m.get(k) or {}).get('value', '')))).strip()
              lic = v('License').lower()
              print(p['title'], '|', v('LicenseShortName'), '|', v('Artist')[:70], '|', v('ImageDescription')[:200])
              if not (lic.startswith('cc0') or lic.startswith('pd') or lic.startswith('cc-by')):
                  print('  lisans uygun değil'); continue
              time.sleep(8)
              try:
                  data = get(ii['url'])
              except Exception as e:
                  print('  İNDİRİLEMEDİ', e); continue
              open('kaynak', 'wb').write(data)
              dur = subprocess.run(['ffprobe', '-v', 'error', '-show_entries', 'format=duration', '-of', 'csv=p=0', 'kaynak'],
                                   capture_output=True, text=True).stdout.strip()
              try:
                  dur = float(dur)
              except ValueError:
                  print('  okunamadı'); continue
              if not 30 <= dur <= 420:
                  print('  süre uygun değil', round(dur)); continue
              n += 1
              ad = re.sub(r'[^A-Za-z0-9]+', '_', p['title'].split(':', 1)[1].rsplit('.', 1)[0]).strip('_')[:40]
              out = f'.ezan_adaylari/{n}_{ad}.mp3'
              subprocess.run(['ffmpeg', '-v', 'error', '-y', '-i', 'kaynak', '-af', 'loudnorm=I=-16:TP=-1.5:LRA=11',
                              '-ac', '1', '-ar', '44100', '-c:a', 'libmp3lame', '-b:a', '56k', out], check=True)
              rows.append(f"{n}. {p['title']}\n   Süre: {int(dur // 60)} dk {int(dur % 60)} sn · Lisans: {v('LicenseShortName')} · "
                          f"Kaynak: {v('Artist')[:80]}\n   Açıklama: {v('ImageDescription')[:200]}\n   {ii['url'].split('?')[0]}\n")
              print('  HAZIR', out, round(dur), 'sn', os.path.getsize(out), 'bayt')
          open('.ezan_adaylari/LISTE2.txt', 'w').write('\n'.join(rows[1:] if rows and not rows[0].startswith(str(6)) else rows))
          print(open('.ezan_adaylari/LISTE2.txt').read())
      - name: Dala ekle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .ezan_adaylari
          git commit -m "Geçici: ezan sesi adayları, ikinci tur"
          git push origin HEAD:claude/charming-davinci-6c5fkr
