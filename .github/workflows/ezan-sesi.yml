name: Ezan sesi hazırla (geçici)

# Geçici: Wikimedia Commons'taki CC0 "Beautiful adhan.ogg" kaydını indirir, lisansını yazdırır,
# kısa ve tam iki bildirim sesi hazırlayıp bu dala ekler. İş bitince silinecek.
on:
  push:
    branches: [claude/charming-davinci-6c5fkr]
    paths: [.github/workflows/ezan-sesi.yml]

permissions:
  contents: write

jobs:
  ses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/charming-davinci-6c5fkr
      - name: Lisans ve dosya bilgisi
        shell: python
        run: |
          import json, urllib.request, urllib.parse
          UA = {'User-Agent': 'EzanSaati/1.0 (github.com/ersinsonmez026-glitch/EzanSaati)'}
          q = ('https://commons.wikimedia.org/w/api.php?action=query&format=json&prop=imageinfo'
               '&iiprop=url|size|mime|extmetadata&titles=' + urllib.parse.quote('File:Beautiful adhan.ogg'))
          d = json.load(urllib.request.urlopen(urllib.request.Request(q, headers=UA), timeout=40))
          page = next(iter(d['query']['pages'].values()))
          ii = page['imageinfo'][0]
          m = ii['extmetadata']
          for k in ('LicenseShortName', 'License', 'UsageTerms', 'Artist', 'Credit', 'ImageDescription', 'Copyrighted'):
              print(k, '=', (m.get(k) or {}).get('value'))
          print('url =', ii['url'], 'size =', ii['size'], 'mime =', ii['mime'])
          lic = ((m.get('License') or {}).get('value') or '').lower()
          assert lic in ('cc0', 'pd', 'public domain') or 'cc0' in lic or lic.startswith('pd'), 'Lisans CC0/kamu malı değil: ' + lic
          urllib.request.urlretrieve(ii['url'], 'kaynak.ogg')
      - name: Sesleri hazırla
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          ffprobe -hide_banner kaynak.ogg 2>&1 | tail -5
          ffmpeg -hide_banner -i kaynak.ogg -af silencedetect=noise=-35dB:d=0.8 -f null - 2>&1 | grep silence_ || true
          # İlk sessizlik 12-35 saniye arasında ise orada kes; yoksa 28. saniyede kes.
          CUT=$(ffmpeg -hide_banner -i kaynak.ogg -af silencedetect=noise=-35dB:d=0.8 -f null - 2>&1 \
            | awk '/silence_start/ {s=$NF; if (s>12 && s<35) {print s; exit}}')
          CUT=${CUT:-28}
          echo "Kısa ses kesim noktası: $CUT sn"
          FADE=$(python3 -c "print(max(0.0, float('$CUT') - 1.5))")
          mkdir -p android/app/src/main/res/raw
          ffmpeg -hide_banner -y -i kaynak.ogg -t "$CUT" -af "loudnorm=I=-16:TP=-1.5:LRA=11,afade=t=out:st=$FADE:d=1.5" \
            -ac 1 -ar 44100 -c:a libvorbis -q:a 4 android/app/src/main/res/raw/ezan_kisa.ogg
          ffmpeg -hide_banner -y -i kaynak.ogg -af "loudnorm=I=-16:TP=-1.5:LRA=11" \
            -ac 1 -ar 44100 -c:a libvorbis -q:a 3 android/app/src/main/res/raw/ezan_tam.ogg
          ls -la android/app/src/main/res/raw
          for f in android/app/src/main/res/raw/*.ogg; do ffprobe -hide_banner "$f" 2>&1 | grep -E "Duration|Audio"; done
      - name: Dala ekle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/res/raw/ezan_kisa.ogg android/app/src/main/res/raw/ezan_tam.ogg
          git commit -m "Ezan sesleri: Wikimedia Commons 'Beautiful adhan.ogg' (CC0), kısa ve tam"
          git push origin HEAD:claude/charming-davinci-6c5fkr
