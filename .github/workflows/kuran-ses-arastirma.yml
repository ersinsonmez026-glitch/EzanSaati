name: Kur'an ses kaynağı kullanım şartları (geçici)

# Geçici: aday kaynakların kullanım şartları sayfalarını okur ve ilgili maddeleri
# log'a yazar. Ses dosyası indirmez, depoya hiçbir şey yazmaz. İş bitince silinecek.
on:
  push:
    branches: [claude/charming-davinci-6c5fkr]
    paths: [.github/workflows/kuran-ses-arastirma.yml]

jobs:
  terms:
    runs-on: ubuntu-latest
    steps:
      - name: Kullanım şartları
        shell: python
        run: |
          import re, time, html, urllib.request
          UA = {'User-Agent': 'Mozilla/5.0 (EzanSaati terms check; https://github.com/ersinsonmez026-glitch/EzanSaati)'}
          KW = re.compile(r'licen|copyright|terms|permi|commercial|stream|redistribut|attribut|third.party|'
                          r'telif|izin|hakları|kullanım|ticari|lisans|©', re.I)
          pages = [
            'https://kuran.diyanet.gov.tr/', 'https://kuran.diyanet.gov.tr/mushaf', 'https://www.diyanet.gov.tr/tr-TR/Kurumsal/Detay/11/yasal-uyari',
            'https://dijital.diyanet.gov.tr/', 'https://quran.foundation/terms', 'https://api-docs.quran.foundation/docs/terms-of-service',
            'https://api-docs.quran.foundation/docs/quran-api-overview', 'https://quran.com/terms-and-conditions',
            'https://quranicaudio.com/', 'https://quranicaudio.com/about', 'https://alquran.cloud/terms-and-conditions',
            'https://alquran.cloud/api', 'https://islamic.network/', 'https://mp3quran.net/eng', 'https://mp3quran.net/eng/api',
            'https://mp3quran.net/api/v3/reciters?language=eng', 'https://everyayah.com/', 'https://everyayah.com/recitations_ayat.html',
            'https://qurancomplex.gov.sa/en/', 'https://www.qurancentral.com/terms-of-use/', 'https://tanzil.net/docs/recitations',
          ]
          for url in pages:
              time.sleep(2)
              try:
                  raw = urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60).read().decode('utf-8', 'replace')
              except Exception as e:
                  print(f'\n##### {url}\nHATA: {e}'); continue
              if url.endswith('reciters?language=eng'):
                  print(f'\n##### {url}\n{raw[:1500]}'); continue
              text = html.unescape(re.sub(r'<script.*?</script>|<style.*?</style>', ' ', raw, flags=re.S))
              text = re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' \n ', text))
              sents = re.split(r'(?<=[.!?])\s+', text)
              hits = [s.strip()[:400] for s in sents if KW.search(s)]
              title = (re.search(r'<title>(.*?)</title>', raw, re.S) or [None, ''])[1].strip()[:100]
              print(f'\n##### {url}\nBAŞLIK: {title} | uzunluk {len(text)} | eşleşme {len(hits)}')
              for h in hits[:40]: print(' -', h)
