name: Günlük dua videoları araştırması (geçici)

# Geçici: günlük duaların okunuş videolarını arar, kanal ve gömülebilirliği yazar. Silinecek.
on:
  push:
    branches: [claude/charming-davinci-6c5fkr]
    paths: [.github/workflows/son-arastirma.yml]

jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - shell: python
        run: |
          import json, re, urllib.request, urllib.parse, time
          UA={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36','Accept-Language':'tr-TR,tr;q=0.9'}
          get=lambda u: urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=30).read().decode('utf-8','ignore')
          def walk(o):
              if isinstance(o,dict):
                  if 'videoRenderer' in o: yield o['videoRenderer']
                  for v in o.values(): yield from walk(v)
              elif isinstance(o,list):
                  for v in o: yield from walk(v)
          Q={1:'Euzu besmele okunuşu',3:'rüku tesbihi Sübhane rabbiyel azim okunuşu',4:'Semiallahu limen hamideh rabbena lekel hamd okunuşu',
             5:'secde tesbihi Sübhane rabbiyel ala okunuşu',10:'namazda selam verme esselamu aleykum ve rahmetullah',
             21:'Allahümme entesselam duası okunuşu',23:'namaz sonrası tesbihat okunuşu',79:'seyyidül istiğfar duası okunuşu',
             80:'bismillahillezi la yedurru duası okunuşu',81:'raditu billahi rabben duası okunuşu',82:'allahumme bike asbahna duası',
             83:'sübhanallahi ve bihamdihi zikri',84:'euzu bikelimatillahit tammati duası',85:'allahumme inni euzu bike min zevali nimetike duası',
             86:'tuvalete girerken okunacak dua',87:'şifa duası allahumme rabben nas ezhibil bes',88:'esalullahel azim rabbel arşil azim en yeşfiyek',
             89:'hasta ziyareti duası la bese tahurun inşallah',90:'allahumme inni euzu bike minel hemmi vel hazen duası',91:'sıkıntı duası la ilahe illallahul azimul halim',
             92:'ya hayyu ya kayyum bi rahmetike estağis duası',93:'estağfirullahel azim ellezi la ilahe illa huvel hayyel kayyume ve etubu ileyh',
             94:'allahumme inneke afuvvun tuhibbul afve fa fu anni',95:'ya mukallibel kulub sebbit kalbi ala dinik',96:'allahumme inni eselukel huda vet tuka duası',
             97:'allahumme einni ala zikrike ve şükrike duası',98:'allahumme inni eseluke ilmen nafian duası',99:'mescide girerken okunacak dua',
             100:'mescitten çıkarken okunacak dua',101:'evden çıkarken okunacak dua bismillahi tevekkeltu',102:'uyumadan önce okunacak dua bismike allahumme',
             103:'uyanınca okunacak dua elhamdulillahillezi ahyana',104:'yemeğe başlarken okunacak dua',105:'yemek duası elhamdulillahillezi et amena'}
          allv={}
          for k,q in Q.items():
              print('#####',k,q)
              try: h=get('https://www.youtube.com/results?search_query='+urllib.parse.quote(q))
              except Exception as e: print('HATA',e); continue
              m=re.search(r'var ytInitialData = (\{.*?\});</script>',h)
              if not m: print('veri yok'); continue
              n=0
              for v in walk(json.loads(m.group(1))):
                  vid=v.get('videoId'); t=''.join(r.get('text','') for r in v.get('title',{}).get('runs',[]))
                  ch=''.join(r.get('text','') for r in v.get('ownerText',{}).get('runs',[]))
                  ln=v.get('lengthText',{}).get('simpleText',''); vc=v.get('viewCountText',{}).get('simpleText','')
                  if not vid or not ln: continue
                  print(f'  {vid} | {ch} | {ln} | {vc} | {t[:90]}'); allv[vid]=1; n+=1
                  if n>=7: break
              time.sleep(1)
          print('--- oembed')
          for vid in allv:
              try:
                  o=json.loads(get('https://www.youtube.com/oembed?format=json&url='+urllib.parse.quote('https://www.youtube.com/watch?v='+vid)))
                  print(vid,'OK')
              except Exception as e: print(vid,'HATA',e)
