name: Dua kaynakları karşılaştırma (geçici)

# Geçici: Diyanet yayınlarındaki dua başlıklarını ve kaynaklarını log'a yazar. Silinecek.
on:
  push:
    branches: [claude/charming-davinci-6c5fkr]
    paths: [.github/workflows/son-arastirma.yml]

jobs:
  bak:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - shell: bash
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36'
          curl -sSL -A "$UA" -o a.pdf 'https://dinhizmetleri.diyanet.gov.tr/Documents/AYETLER%20%C3%87ER%C3%87EVES%C4%B0NDE%20DUA%202024.pdf' || true
          curl -sSL -A "$UA" -o b.pdf 'https://webdosyasp.diyanet.gov.tr/muftuluk/UserFiles/sakarya/Ilceler/serdivan/UserFiles/Files/DUA-VE-SURELER_6f63ec8e-aee7-4ec2-9d6d-67b42174eda3.pdf' || true
          curl -sSL -A "$UA" -o c.html 'https://mobil.diyanet.gov.tr/mobile/web/uygulamalar/suredua.html' || true
          for f in a b; do echo "##### $f"; file $f.pdf; pdfinfo $f.pdf 2>/dev/null | grep -E "Pages|Title|Author|Creator"; pdftotext -layout $f.pdf $f.txt 2>/dev/null; wc -l $f.txt; done
          echo "##### a: başlık ve kaynak satırları"
          grep -nE "^\s{0,20}[0-9]+[.-]|Sûresi|Suresi|\([A-ZÂÎÛÇĞİÖŞÜ][^()]{2,25}, ?[0-9]+/[0-9]" a.txt | sed 's/  \+/ /g' | head -400
          echo "##### b: tam metin (ilk 500 satır)"
          sed 's/  \+/ /g' b.txt | grep -v "^\s*$" | head -500
          echo "##### c"
          sed 's/<[^>]*>/ /g' c.html | tr -s ' \n' | head -c 3000
