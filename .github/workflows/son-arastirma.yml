name: Ramazan kaynak araştırması (geçici)

# Geçici: Ramazan ve Esmâ içerikleri için kaynak sayfalarını çeker, metni yazdırır. Silinecek.
on:
  push:
    branches: [claude/charming-davinci-6c5fkr]
    paths: [.github/workflows/son-arastirma.yml]

jobs:
  kaynak:
    runs-on: ubuntu-latest
    steps:
      - run: sudo /usr/bin/python -m pip install -q --break-system-packages pypdf
      - shell: python
        run: |
          import json, re, urllib.request, urllib.parse, time, html as H
          UA={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36','Accept-Language':'tr-TR,tr;q=0.9'}
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=40).read().decode('utf-8','ignore')
          def text(h):
              h=re.sub(r'(?s)<(script|style)[^>]*>.*?</\1>',' ',h)
              h=re.sub(r'<br\s*/?>|</p>|</li>|</tr>|</h\d>','\n',h)
              return re.sub(r'[ \t]+',' ',H.unescape(re.sub(r'<[^>]+>',' ',h)))
          def ddg(q):
              print('\n##### ARA:',q)
              try:
                  h=get('https://html.duckduckgo.com/html/?q='+urllib.parse.quote(q))
                  for u,t in re.findall(r'class="result__a" href="([^"]+)"[^>]*>(.*?)</a>',h)[:8]:
                      m=re.search(r'uddg=([^&]+)',u); u=urllib.parse.unquote(m.group(1)) if m else u
                      print('  ',u,'|',re.sub('<[^>]+>','',H.unescape(t))[:100])
              except Exception as e: print('HATA',e)
              time.sleep(2)
          def page(u,keys=None,maxc=6000):
              print('\n##### SAYFA:',u)
              try: t=text(get(u))
              except Exception as e: print('HATA',e); return
              t=re.sub(r'\n\s*\n+','\n',t)
              if keys:
                  for k in keys:
                      for m in list(re.finditer(k,t))[:3]:
                          print('--[',k,']--',t[max(0,m.start()-300):m.start()+1500].replace('\n',' / '))
              else: print(t[:maxc])
          def links(u,pat):
              print('\n##### LİNK:',u)
              try: h=get(u)
              except Exception as e: print('HATA',e); return []
              print('uzunluk',len(h))
              out=[]
              for href,t in re.findall(r'<a[^>]+href="([^"]+)"[^>]*>(.*?)</a>',h,re.S):
                  t=re.sub(r'\s+',' ',re.sub('<[^>]+>','',H.unescape(t))).strip()
                  if re.search(pat,href+' '+t,re.I):
                      full=urllib.parse.urljoin(u,H.unescape(href)); out.append(full); print('  ',full,'|',t[:90])
              return out
          import subprocess, io
          from pypdf import PdfReader
          def pdf(u,name):
              print('\n##### PDF:',name)
              try:
                  b=urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=60).read()
                  r=PdfReader(io.BytesIO(b)); t='\n'.join((pg.extract_text() or '') for pg in r.pages)
                  print('sayfa',len(r.pages),'karakter',len(t)); return t
              except Exception as e: print('HATA',e); return ''
          o=pdf('https://diykapi.diyanet.gov.tr/api/Files/ReadFile/0193c42d-cc23-7435-cad4-eb3193469b9e','Oruç SSS')
          open('oruc.txt','w').write(o)
          z=pdf('https://diykapi.diyanet.gov.tr/api/Files/ReadFile/0193c42d-cbef-74c8-2587-94bbc2a36b70','Zekât SSS')
          open('zekat.txt','w').write(z)
          # soru başlıklarını listele
          for name,t in (('ORUÇ',o),('ZEKÂT',z)):
              print('\n##### SORULAR',name)
              for line in t.split('\n'):
                  if line.strip().endswith('?'): print('  ',line.strip()[:160])
          for k in ['nisap','nisab','80,18','2,5','kırkta','fitre','fidye']:
              for m in list(re.finditer(k,z+o))[:3]:
                  print('--[',k,']--',(z+o)[max(0,m.start()-400):m.start()+700].replace('\n',' '))
          # duyurularda fitre
          for pg in range(1,8):
              try:
                  h=get(f'https://kurul.diyanet.gov.tr/tr/duyurular?page={pg}')
                  for href,t in re.findall(r'<a[^>]+href="([^"]+)"[^>]*>(.*?)</a>',h,re.S):
                      t=re.sub(r'\s+',' ',re.sub('<[^>]+>','',H.unescape(t))).strip()
                      if re.search('fitre|fidye|zek',href+t,re.I): print('DUYURU',pg,urllib.parse.urljoin('https://kurul.diyanet.gov.tr',href),'|',t[:120])
              except Exception as e: print('HATA duyuru',pg,e)
          # vakithesaplama: ham HTML'de form/ajax izleri
          h=get('https://vakithesaplama.diyanet.gov.tr/dinigunler.php?yil=2028')
          for line in h.split('\n'):
              if re.search(r'ajax|\.php|yil|\$\.(get|post)|fetch\(|<form|<select|<option',line,re.I): print('HTML>',line.strip()[:220])
          # esma: diyanet siteleri
          for u in ['https://hadislerleislam.diyanet.gov.tr/','https://kuran.diyanet.gov.tr/','https://www.diyanet.gov.tr/tr-TR/','https://dinibilgiler.diyanet.gov.tr/','https://cocuk.diyanet.gov.tr/']:
              try:
                  h=get(u); print('\n##### ESMA-LİNK',u,len(h))
                  for href,t in re.findall(r'<a[^>]+href="([^"]+)"[^>]*>(.*?)</a>',h,re.S):
                      t=re.sub(r'\s+',' ',re.sub('<[^>]+>','',H.unescape(t))).strip()
                      if re.search('esma|esmâ|isim|isimler',href+' '+t,re.I): print('  ',urllib.parse.urljoin(u,href),'|',t[:100])
              except Exception as e: print('HATA',u,e)
      - uses: actions/upload-artifact@v4
        with:
          name: kaynak-metinler
          path: '*.txt'
