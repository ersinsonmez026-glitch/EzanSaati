name: Dua kaynakları karşılaştırma (geçici)

# Geçici: Diyanet yayınlarındaki dua başlıklarını ve kaynaklarını log'a yazar. Silinecek.
on:
  push:
    branches: [claude/charming-davinci-6c5fkr]
    paths: [.github/workflows/son-arastirma.yml]

jobs:
  bak:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - shell: bash
        run: |
          set +e +o pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36'
          curl -sSL -A "$UA" -o a.pdf 'https://dinhizmetleri.diyanet.gov.tr/Documents/AYETLER%20%C3%87ER%C3%87EVES%C4%B0NDE%20DUA%202024.pdf'
          pdftotext -layout a.pdf a.txt
          echo "##### A: Ayetler Çerçevesinde Dua (tam metin, Arapça hariç)"
          sed 's/  \+/ /g' a.txt | grep -v "^\s*$" | grep -vP '[\x{0600}-\x{06FF}]{3,}'
          echo "##### B: Peygamberimizin Dilinden Dualar sayfası"
          curl -sSL -A "$UA" -o k.html 'https://dijital.diyanet.gov.tr/Kitaplik/hadis-ve-siyer/peygamberimizin-dilinden-dualar?id=384'
          grep -oiE 'href="[^"]+\.(pdf|epub)[^"]*"|data-[a-z-]*url="[^"]+"|https?://[^" ]+\.pdf' k.html | head
          sed 's/<[^>]*>/ /g' k.html | tr -s ' \t' | grep -v "^\s*$" | grep -iE "dua|kitap|sayfa|yazar|hazırlayan|pdf|oku" | head -40
          echo "##### C: Ezan Vakti Pro sitesi"
          for u in https://www.ezanvaktipro.com/dualar/ https://www.ezanvaktipro.com/dua/ https://www.ezanvaktipro.com/; do echo "== $u"; curl -sSL -A "$UA" -o e.html -w "%{http_code}\n" "$u"; sed 's/<[^>]*>/\n/g' e.html | tr -s ' \t' | grep -v "^\s*$" | grep -i "dua" | sort -u | head -40; done
