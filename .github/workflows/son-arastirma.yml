name: Dua videoları araştırması (geçici)

# Geçici: Diyanet'in resmî kanallarında namaz duası videolarını arar, gömülebilirliğini kontrol eder. Silinecek.
on:
  push:
    branches: [claude/charming-davinci-6c5fkr]
    paths: [.github/workflows/son-arastirma.yml]

jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - shell: python
        run: |
          import json, re, urllib.request, urllib.parse
          UA={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36','Accept-Language':'tr-TR,tr;q=0.9'}
          get=lambda u: urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=30).read().decode('utf-8','ignore')
          def walk(o):
              if isinstance(o,dict):
                  if 'videoRenderer' in o: yield o['videoRenderer']
                  for v in o.values(): yield from walk(v)
              elif isinstance(o,list):
                  for v in o: yield from walk(v)
          seen={}
          qs=['Diyanet Sübhaneke duası','Diyanet Ettehiyyatü duası','Diyanet Allahümme salli barik','Diyanet Rabbena duaları',
              'Diyanet kunut duaları','Diyanet Ayetel Kürsi','Diyanet ezan duası','Diyanet namaz duaları ezberliyorum',
              'Diyanet Çocuk namaz duaları','Diyanet namaz sureleri ve duaları','Diyanet Fatiha suresi ezber','DiyanetTV namaz duaları anlamı']
          for q in qs:
              print('#####',q)
              try: h=get('https://www.youtube.com/results?search_query='+urllib.parse.quote(q))
              except Exception as e: print('HATA',e); continue
              m=re.search(r'var ytInitialData = (\{.*?\});</script>',h)
              if not m: print('veri yok'); continue
              for v in walk(json.loads(m.group(1))):
                  vid=v.get('videoId'); t=''.join(r.get('text','') for r in v.get('title',{}).get('runs',[]))
                  ch=''.join(r.get('text','') for r in v.get('ownerText',{}).get('runs',[]))
                  ln=v.get('lengthText',{}).get('simpleText',''); vc=v.get('viewCountText',{}).get('simpleText','')
                  if vid and 'iyanet' in ch:
                      print(f'  {vid} | {ch} | {ln} | {vc} | {t}'); seen[vid]=1
          print('--- oembed')
          for vid in seen:
              try:
                  o=json.loads(get('https://www.youtube.com/oembed?format=json&url='+urllib.parse.quote('https://www.youtube.com/watch?v='+vid)))
                  print(vid,'OK',o['author_name'])
              except Exception as e: print(vid,'HATA',e)
