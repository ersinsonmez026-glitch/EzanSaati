name: Ezan sesi ve namaz videosu araştırması (geçici)

# Geçici: serbest lisanslı ezan kayıtlarını ölçer/çözümler ve Diyanet namaz videolarını listeler.
# Yalnızca log'a yazar, depoya bir şey eklemez. İş bitince silinecek.
on:
  push:
    branches: [claude/charming-davinci-6c5fkr]
    paths: [.github/workflows/son-arastirma.yml]

jobs:
  ses:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: pip install -q faster-whisper
      - shell: python
        run: |
          import json, urllib.request, urllib.parse, subprocess, re, html
          UA={'User-Agent':'EzanSaati/1.0 (https://github.com/ersinsonmez026-glitch/EzanSaati)'}
          files=['Adhan in Istanbul.webm','Hminsec150 Konya.webm','Beautiful adhan.ogg','Adhan.ogg','Azan.ogg',
                 'The Adhan - Muslim Call to Prayer - Aaqib Azeez.mp3','Athan in Ramadan.wav','Athan during Ramadan 2.wav',
                 'Adhan wiki.oga','Call to prayer.ogg','Islamic call to worship.oga']
          from faster_whisper import WhisperModel
          model=WhisperModel('small',device='cpu',compute_type='int8')
          for f in files:
              t='File:'+f
              r=json.load(urllib.request.urlopen(urllib.request.Request('https://commons.wikimedia.org/w/api.php?'+urllib.parse.urlencode(dict(action='query',titles=t,prop='imageinfo',iiprop='extmetadata|url',format='json')),headers=UA)))
              ii=list(r['query']['pages'].values())[0]['imageinfo'][0]; m=ii['extmetadata']
              g=lambda k: re.sub('<[^>]+>','',html.unescape(m.get(k,{}).get('value','')))[:160]
              print('=====',f); print('lisans:',g('LicenseShortName'),'| yazar:',g('Artist'),'| kaynak:',g('Credit'),'| tarih:',g('DateTimeOriginal'))
              print('açıklama:',g('ImageDescription'))
              req=urllib.request.Request(ii['url'],headers=UA); open('in','wb').write(urllib.request.urlopen(req).read())
              subprocess.run(['ffmpeg','-v','error','-y','-i','in','-vn','-ac','1','-ar','16000','a.wav'])
              out=subprocess.run(['ffmpeg','-i','a.wav','-af','volumedetect,silencedetect=n=-35dB:d=1.5','-f','null','-'],capture_output=True,text=True).stderr
              dur=re.search(r'Duration: ([\d:.]+)',out); mv=re.search(r'mean_volume: ([-\d.]+)',out); xv=re.search(r'max_volume: ([-\d.]+)',out)
              print('süre',dur and dur.group(1),'ort dB',mv and mv.group(1),'max dB',xv and xv.group(1),'sessizlik',len(re.findall('silence_start',out)))
              segs,info=model.transcribe('a.wav',language='ar',beam_size=1)
              print('çözüm:',' | '.join(s.text.strip() for s in segs)[:900])
  video:
    runs-on: ubuntu-latest
    steps:
      - shell: python
        run: |
          import json, re, urllib.request, urllib.parse
          UA={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36','Accept-Language':'tr-TR,tr;q=0.9'}
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=30).read().decode('utf-8','ignore')
          seen={}
          for q in ['DiyanetTV ikindi namazı nasıl kılınır','DiyanetTV yatsı namazı nasıl kılınır','DiyanetTV vitir namazı nasıl kılınır',
                    'DiyanetTV cuma namazı nasıl kılınır','DiyanetTV bayram namazı nasıl kılınır','DiyanetTV teyemmüm nasıl alınır',
                    'DiyanetTV namaz nasıl kılınır uygulamalı anlatım','Diyanet Çocuk teyemmüm']:
              h=get('https://www.youtube.com/results?search_query='+urllib.parse.quote(q))
              m=re.search(r'var ytInitialData = (\{.*?\});</script>',h)
              if not m: print('veri yok',q); continue
              d=json.loads(m.group(1))
              def walk(o):
                  if isinstance(o,dict):
                      if 'videoRenderer' in o: yield o['videoRenderer']
                      for v in o.values(): yield from walk(v)
                  elif isinstance(o,list):
                      for v in o: yield from walk(v)
              for v in walk(d):
                  vid=v.get('videoId'); t=''.join(r.get('text','') for r in v.get('title',{}).get('runs',[]))
                  ch=''.join(r.get('text','') for r in v.get('ownerText',{}).get('runs',[]))
                  ln=v.get('lengthText',{}).get('simpleText',''); views=v.get('viewCountText',{}).get('simpleText','')
                  pub=v.get('publishedTimeText',{}).get('simpleText','')
                  if vid and vid not in seen and 'iyanet' in ch and ('amaz' in t or 'bdest' in t or 'eyemm' in t):
                      seen[vid]=1; print(f'{vid} | {ch} | {ln} | {views} | {pub} | {t}')
          print('--- oembed (gömülebilir mi)')
          for vid in list(seen)[:60]:
              try:
                  o=json.loads(get('https://www.youtube.com/oembed?format=json&url='+urllib.parse.quote('https://www.youtube.com/watch?v='+vid)))
                  print(vid,'OK',o.get('author_name'),'|',o.get('author_url'))
              except Exception as e: print(vid,'HATA',e)
