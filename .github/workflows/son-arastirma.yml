name: Dua kaynakları karşılaştırma (geçici)

# Geçici: Diyanet ve yaygın uygulamaların dua sayfalarındaki başlıkları log'a yazar. Silinecek.
on:
  push:
    branches: [claude/charming-davinci-6c5fkr]
    paths: [.github/workflows/son-arastirma.yml]

jobs:
  bak:
    runs-on: ubuntu-latest
    steps:
      - shell: python
        run: |
          import re, html, urllib.request, urllib.parse
          UA={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36','Accept-Language':'tr-TR,tr;q=0.9'}
          def get(u):
              try: return urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=25).read().decode('utf-8','ignore')
              except Exception as e: return f'HATA {e}'
          def ddg(q):
              h=get('https://html.duckduckgo.com/html/?q='+urllib.parse.quote(q))
              out=[]
              for m in re.finditer(r'<a rel="nofollow" class="result__a" href="([^"]+)"[^>]*>(.*?)</a>',h):
                  u=html.unescape(m.group(1)); t=re.sub('<[^>]+>','',html.unescape(m.group(2)))
                  mm=re.search(r'uddg=([^&]+)',u)
                  if mm: u=urllib.parse.unquote(mm.group(1))
                  out.append((u,t))
              return out
          qs=['site:diyanet.gov.tr Kuran\'dan dualar','site:kuran.diyanet.gov.tr dualar','site:diyanet.gov.tr Hz. Peygamber\'in dualarından',
              'Diyanet dualar Rabbena duaları kaynak','site:ezanvaktipro.com dualar','site:dinbilgisi.diyanet.gov.tr dua',
              'site:diyanet.gov.tr günlük dualar yemek duası','site:diyanet.gov.tr kunut duaları','Diyanet İlmihal namaz duaları sübhaneke tahiyyat']
          for q in qs:
              print('#####',q)
              for u,t in ddg(q)[:10]: print('  ',t,'|',u)
