name: Uygulama karşılaştırma araştırması (geçici)

# Geçici: Ezan Vakti Pro'nun Google Play sayfasındaki özellik açıklamasını log'a yazar. Silinecek.
on:
  push:
    branches: [claude/charming-davinci-6c5fkr]
    paths: [.github/workflows/son-arastirma.yml]

jobs:
  bak:
    runs-on: ubuntu-latest
    steps:
      - shell: python
        run: |
          import re, html, urllib.request, urllib.parse, json
          UA={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) Chrome/124 Safari/537.36','Accept-Language':'tr-TR,tr;q=0.9'}
          get=lambda u: urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=30).read().decode('utf-8','ignore')
          h=get('https://play.google.com/store/search?q='+urllib.parse.quote('Ezan Vakti Pro')+'&c=apps&hl=tr&gl=TR')
          ids=[]
          for m in re.findall(r'/store/apps/details\?id=([\w.]+)',h):
              if m not in ids: ids.append(m)
          print('ids',ids[:8])
          for pid in ids[:3]:
              p=get(f'https://play.google.com/store/apps/details?id={pid}&hl=tr&gl=TR')
              t=re.search(r'<title[^>]*>(.*?)</title>',p,re.S)
              d=re.search(r'<meta name="description" content="(.*?)"',p,re.S)
              print('=====',pid, html.unescape(t.group(1)) if t else '')
              body=re.search(r'data-g-id="description"[^>]*>(.*?)</div>',p,re.S)
              txt=html.unescape(re.sub(r'<br\s*/?>','\n',body.group(1))) if body else (html.unescape(d.group(1)) if d else '')
              print(re.sub(r'<[^>]+>','',txt)[:5000])
