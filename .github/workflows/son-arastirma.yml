name: Ezan kaydı lisans araştırması (geçici)

# Geçici: Wikimedia Commons'ta serbest lisanslı ezan kayıtlarını listeler (yalnızca bilgi, indirme yok). Silinecek.
on:
  push:
    branches: [claude/charming-davinci-6c5fkr]
    paths: [.github/workflows/son-arastirma.yml]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - shell: python
        run: |
          import json, urllib.request, urllib.parse, re, html
          UA={'User-Agent':'EzanSaati/1.0 (https://github.com/ersinsonmez026-glitch/EzanSaati)'}
          def api(**p):
              p.update(format='json')
              u='https://commons.wikimedia.org/w/api.php?'+urllib.parse.urlencode(p)
              return json.load(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=30))
          titles=set()
          for q in ['adhan','azan','ezan','adhaan','athan','call to prayer','Ezan sesi','ezan okuyan','müezzin','أذان']:
              r=api(action='query',list='search',srsearch=q+' filetype:audio',srnamespace=6,srlimit=50)
              for x in r['query']['search']: titles.add(x['title'])
          r2=api(action='query',list='categorymembers',cmtitle='Category:Adhan',cmlimit=200,cmtype='file')
          for x in r2['query']['categorymembers']: titles.add(x['title'])
          titles=sorted(titles)
          print('toplam',len(titles))
          for i in range(0,len(titles),40):
              r=api(action='query',titles='|'.join(titles[i:i+40]),prop='imageinfo',iiprop='extmetadata|size|mediatype|mime|url')
              for p in r['query']['pages'].values():
                  ii=(p.get('imageinfo') or [{}])[0]; m=ii.get('extmetadata',{})
                  g=lambda k: re.sub('<[^>]+>','',html.unescape(m.get(k,{}).get('value','')))[:110]
                  print('|'.join([p['title'][:100], ii.get('mime',''), str(ii.get('size','')), str(round(float(ii.get('duration',0) or 0))), g('LicenseShortName'), g('Artist'), g('ImageDescription')[:110], ii.get('descriptionurl','')]))
