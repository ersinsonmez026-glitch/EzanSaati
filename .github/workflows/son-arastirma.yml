name: Ramazan kaynak araştırması (geçici)

# Geçici: Ramazan ve Esmâ içerikleri için kaynak sayfalarını çeker, metni yazdırır. Silinecek.
on:
  push:
    branches: [claude/charming-davinci-6c5fkr]
    paths: [.github/workflows/son-arastirma.yml]

jobs:
  kaynak:
    runs-on: ubuntu-latest
    steps:
      - run: sudo /usr/bin/python -m pip install -q --break-system-packages pypdf
      - shell: python
        run: |
          import json, re, urllib.request, urllib.parse, time, html as H
          UA={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36','Accept-Language':'tr-TR,tr;q=0.9'}
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=40).read().decode('utf-8','ignore')
          def text(h):
              h=re.sub(r'(?s)<(script|style)[^>]*>.*?</\1>',' ',h)
              h=re.sub(r'<br\s*/?>|</p>|</li>|</tr>|</h\d>','\n',h)
              return re.sub(r'[ \t]+',' ',H.unescape(re.sub(r'<[^>]+>',' ',h)))
          def ddg(q):
              print('\n##### ARA:',q)
              try:
                  h=get('https://html.duckduckgo.com/html/?q='+urllib.parse.quote(q))
                  for u,t in re.findall(r'class="result__a" href="([^"]+)"[^>]*>(.*?)</a>',h)[:8]:
                      m=re.search(r'uddg=([^&]+)',u); u=urllib.parse.unquote(m.group(1)) if m else u
                      print('  ',u,'|',re.sub('<[^>]+>','',H.unescape(t))[:100])
              except Exception as e: print('HATA',e)
              time.sleep(2)
          def page(u,keys=None,maxc=6000):
              print('\n##### SAYFA:',u)
              try: t=text(get(u))
              except Exception as e: print('HATA',e); return
              t=re.sub(r'\n\s*\n+','\n',t)
              if keys:
                  for k in keys:
                      for m in list(re.finditer(k,t))[:3]:
                          print('--[',k,']--',t[max(0,m.start()-300):m.start()+1500].replace('\n',' / '))
              else: print(t[:maxc])
          def links(u,pat):
              print('\n##### LİNK:',u)
              try: h=get(u)
              except Exception as e: print('HATA',e); return []
              print('uzunluk',len(h))
              out=[]
              for href,t in re.findall(r'<a[^>]+href="([^"]+)"[^>]*>(.*?)</a>',h,re.S):
                  t=re.sub(r'\s+',' ',re.sub('<[^>]+>','',H.unescape(t))).strip()
                  if re.search(pat,href+' '+t,re.I):
                      full=urllib.parse.urljoin(u,H.unescape(href)); out.append(full); print('  ',full,'|',t[:90])
              return out
          import subprocess, io
          from pypdf import PdfReader
          def pdf(u,name):
              print('\n##### PDF:',name)
              try:
                  b=urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=60).read()
                  r=PdfReader(io.BytesIO(b)); t='\n'.join((pg.extract_text() or '') for pg in r.pages)
                  print('sayfa',len(r.pages),'karakter',len(t)); return t
              except Exception as e: print('HATA',e); return ''
          o=pdf('https://diykapi.diyanet.gov.tr/api/Files/ReadFile/0193c42d-cc23-7435-cad4-eb3193469b9e','Oruç SSS')
          def dump(name,t):
              print('\n#####BEGIN',name)
              for i in range(0,len(t),900): print('|'+t[i:i+900].replace('\n',' '))
              print('#####END',name)
          a=o.rfind('28. Orucu bozan'); b=o.rfind('59. Ramazan ayını'); dump('BOZAN',o[a:b])
          a=o.rfind('5. Oruç fidyesi ne demektir'); b=o.rfind('7. İmsak nedir'); dump('FIDYE',o[a:b])
          a=o.rfind('25. Oruç fidyesi nasıl'); b=o.rfind('28. Orucu bozan'); dump('FIDYE2',o[a:b])
          a=o.rfind('20. Oruçlu kimse abdest'); b=o.rfind('23. Fıtır sadakası'); dump('ABDEST',o[a:b])
          for u in ['https://vakithesaplama.diyanet.gov.tr/','https://vakithesaplama.diyanet.gov.tr/dinigunler.php?yil=2028']:
              h=get(u)
              for href in sorted(set(re.findall(r'href="?([^" >]+)',h))):
                  if re.search('gun|yil|2028',href,re.I): print('VH',u,'->',href)
          SL=['rahman', 'rahim', 'melik', 'kuddus', 'selam', 'mumin', 'muheymin', 'aziz', 'cebbar', 'mutekebbir', 'halik', 'bari', 'musavvir', 'gaffar', 'kahhar', 'vehhab', 'rezzak', 'fettah', 'alim', 'kabiz', 'basit', 'hafid', 'rafi', 'muiz', 'muzil', 'semi', 'basir', 'hakem', 'adl', 'latif', 'habir', 'halim', 'azim', 'gafur', 'sekur', 'ali', 'kebir', 'hafiz', 'mukit', 'hasib', 'celil', 'kerim', 'rakib', 'mucib', 'vasi', 'hakim', 'vedud', 'mecid', 'bais', 'sehid', 'hak', 'vekil', 'kavi', 'metin', 'veli', 'hamid', 'muhsi', 'mubdi', 'muid', 'muhyi', 'mumit', 'hay', 'kayyum', 'vacid', 'macid', 'vahid', 'samed', 'kadir', 'muktedir', 'mukaddim', 'muahhir', 'evvel', 'ahir', 'zahir', 'batin', 'vali', 'muteali', 'berr', 'tevvab', 'muntekim', 'afuv', 'rauf', 'malikul-mulk', 'zul-celal-vel-ikram', 'muksit', 'cami', 'gani', 'mugni', 'mani', 'darr', 'nafi', 'nur', 'hadi', 'bedi', 'baki', 'varis', 'resid', 'sabur']
          for n,sl in enumerate(SL,1):
              try:
                  t=re.sub(r'\s+',' ',text(get('https://islamansiklopedisi.org.tr/'+sl)))
                  title=t[:80].strip()
                  j=t.find('Sözlükte')
                  if 'Arama - TDV' in title:
                      hh=get('https://islamansiklopedisi.org.tr/'+sl)
                      ls=[x for x in re.findall(r'href="(/[a-z0-9\-]+)"',hh) if len(x)>2][:12]
                      print('ESMA',n,sl,'ARAMA',ls)
                  else:
                      print('ESMA',n,sl,'|',title[:40],'|',t[j:j+420] if j>=0 else t[600:1000])
              except Exception as e: print('ESMA',n,sl,'HATA',e)
              time.sleep(0.5)
