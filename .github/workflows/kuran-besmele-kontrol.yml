name: Kur'an ayet dosyalarında besmele kontrolü (geçici)

# Geçici: sûrelerin 1. ayet dosyasının besmele ile başlayıp başlamadığını ölçer (1.mp3 = Fâtiha 1 = besmele).
# Yalnızca log'a yazar; depoya hiçbir şey eklemez. İş bitince silinecek.
on:
  push:
    branches: [claude/charming-davinci-6c5fkr]
    paths: [.github/workflows/kuran-besmele-kontrol.yml]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q numpy
      - shell: python
        run: |
          import subprocess, urllib.request, numpy as np
          UA = {'User-Agent': 'Mozilla/5.0 (EzanSaati research)'}
          SR = 8000
          def pcm(n):
              d = urllib.request.urlopen(urllib.request.Request(f'https://cdn.islamic.network/quran/audio/128/ar.alafasy/{n}.mp3', headers=UA), timeout=60).read()
              p = subprocess.run(['ffmpeg', '-v', 'error', '-i', 'pipe:0', '-ac', '1', '-ar', str(SR), '-f', 's16le', 'pipe:1'], input=d, capture_output=True)
              return np.frombuffer(p.stdout, dtype=np.int16).astype(np.float32)
          def best(sig, probe):
              if len(sig) < len(probe): sig = np.pad(sig, (0, len(probe) - len(sig)))
              c = np.correlate(sig, probe, 'valid')
              e = np.sqrt(np.convolve(sig ** 2, np.ones(len(probe)), 'valid')) * np.linalg.norm(probe) + 1e-9
              k = int(np.argmax(c / e)); return k / SR, float((c / e)[k])
          b = pcm(1); probe = b[int(0.3 * SR):int(2.3 * SR)]
          print(f'besmele (1.mp3) {len(b)/SR:.2f} sn')
          # sûre: (ilk ayet global no)  — 2, 3, 36, 67, 78, 97, 112, 113, 114 ve besmelesiz 9
          for s, n in [(2, 8), (3, 294), (9, 1236), (36, 3706), (67, 5242), (78, 5673), (97, 6125), (112, 6222), (113, 6226), (114, 6231)]:
              a = pcm(n); at, sc = best(a[:int(8 * SR)], probe)
              print(f'sûre {s:3d} ayet 1 (#{n}): {len(a)/SR:6.2f} sn | besmele benzerliği {sc:.3f} @ {at:.2f} sn')
          # karşılaştırma: besmele içermeyen bir ara ayet
          for n in (9, 3707):
              a = pcm(n); at, sc = best(a[:int(8 * SR)], probe); print(f'ara ayet #{n}: benzerlik {sc:.3f}')
