name: Diyanet hadis kaynağı (inceleme)

# Diyanet'in resmî hadis sitelerinin yapısını inceler (hangi sayfalar var, hadisler nasıl duruyor).
# Yalnız okur; sonuç diyanet-sayfalar paketinde. Uygulamaya bir şey eklemez.

on:
  workflow_dispatch:
  push:
    branches: [claude/charming-davinci-6c5fkr]
    paths:
      - .github/workflows/diyanet-arama.yml

jobs:
  incele:
    runs-on: ubuntu-latest
    steps:
      - name: Sayfaları indir
        run: |
          mkdir -p out
          python3 - <<'PY'
          import re, urllib.request, urllib.parse
          def get(u):
              req = urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0 EzanSaati/1.0'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.status, r.geturl(), r.read().decode('utf-8', 'replace')
          def text(html):
              html = re.sub(r'<(script|style)[^>]*>.*?</\1>', ' ', html, flags=re.S)
              return re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', html)).strip()
          root = 'https://hadislerleislam.diyanet.gov.tr/'
          queue, seen = [root, root + 'robots.txt', root + 'sitemap.xml'], set()
          while queue and len(seen) < 14:
              u = queue.pop(0)
              if u in seen: continue
              seen.add(u)
              try:
                  st, final, body = get(u)
              except Exception as e:
                  print(f'\n=== {u} -> HATA {e}'); continue
              n = len(seen)
              open(f'out/s{n}.html', 'w').write(body)
              print(f'\n=== {u} -> {st} {final} ({len(body)} bayt)')
              if u.endswith(('.txt', '.xml')):
                  print(body[:1200]); continue
              print('METİN:', text(body)[:1500])
              links = sorted(set(urllib.parse.urljoin(final, l) for l in re.findall(r'href="([^"#]+)"', body)))
              own = [l for l in links if 'hadislerleislam' in l and not re.search(r'\.(css|js|ico|png|jpg|svg)', l)]
              print('SİTE İÇİ BAĞLANTI', len(own))
              for l in own[:80]: print('  ', l)
              queue += [l for l in own if l not in seen][:5]
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diyanet-sayfalar
          path: out
          retention-days: 7
