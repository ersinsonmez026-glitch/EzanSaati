name: Kısa hadis listesi (Diyanet, Hadislerle İslâm)

# Diyanet İşleri Başkanlığı'nın "Hadislerle İslâm" eserinden (hadislerleislam.diyanet.gov.tr) kısa
# hadisleri toplar: metin içinde tırnakla verilen ve dipnotu Kütüb-i Sitte'yi (Buhârî, Müslim, Ebû Dâvûd,
# Tirmizî, Nesâî, İbn Mâce) gösteren sözler. Metin değiştirilmez. Sonuç diyanet-hadisler paketinde;
# uygulamaya eklenmez (önce gözden geçirilecek).

on:
  workflow_dispatch:
  push:
    branches: [claude/charming-davinci-6c5fkr]
    paths:
      - .github/workflows/diyanet-arama.yml

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Hadisleri topla
        run: |
          mkdir -p out
          python3 - <<'PY'
          import html as H, json, re, time, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          ROOT = 'https://hadislerleislam.diyanet.gov.tr/sayfa.php'
          def get(u):
              for i in range(4):
                  try:
                      req = urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0 EzanSaati/1.0'})
                      with urllib.request.urlopen(req, timeout=40) as r:
                          return r.read().decode('utf-8', 'replace')
                  except Exception as e:
                      time.sleep(3 + i * 5)
              print('alınamadı', u); return ''
          def plain(x):
              x = re.sub(r'<[^>]+>', '', x)
              return re.sub(r'\s+', ' ', H.unescape(x)).strip()
          BOOKS = r'^(Buhârî|Müslim|Ebû Dâvûd|Tirmizî|Nesâî|İbn Mâce)\b'
          PROPHET = r'Peygamber|Resûl|Resul|Nebî|Efendimiz|buyur'
          def page(cv):
              cilt, sayfa = cv
              h = get(f'{ROOT}?CILT={cilt}&SAYFA={sayfa}')
              time.sleep(0.4)
              if 'dipnotdiv' not in h: return []
              main, notes = h.split('dipnotdiv', 1)
              src = {}
              for n, body in re.findall(r'<p>(\d+)\s*</font>\s*<font color="black">(.*?)</p>', notes, re.S):
                  src[n] = re.sub(r'^[A-ZİÜÖÇŞĞ]+\d+(/\d+)?\s+', '', plain(body))
              out = []
              for m in re.finditer(r'“([^“”]{20,220})”(.{0,120}?)<sup[^>]*>(\d+)</sup>', main, re.S):
                  quote, between, n = plain(m.group(1)), plain(m.group(2)), m.group(3)
                  source = src.get(n, '')
                  if not re.search(BOOKS, source): continue
                  if len(quote) > 170 or len(between) > 40: continue
                  before = plain(main[max(0, m.start() - 300):m.start()])[-160:]
                  if not re.search(PROPHET, before + ' ' + between): continue
                  out.append({'text': quote, 'source': source, 'cilt': cilt, 'sayfa': sayfa,
                              'url': f'{ROOT}?CILT={cilt}&SAYFA={sayfa}'})
              return out
          jobs = []
          for cilt in range(1, 8):
              first = get(f'{ROOT}?CILT={cilt}&SAYFA=1')
              nums = re.findall(r'<option[^>]*>\s*(\d+)\s*</option>', first) + re.findall(r'SAYFA=(\d+)', first)
              last = max(int(x) for x in nums) if nums else 0
              if last < 50:
                  print('sayfa listesi bulunamadı:', first[first.find('Sayfa:'):][:800])
              print('cilt', cilt, 'sayfa', last)
              jobs += [(cilt, p) for p in range(1, last + 1)]
          found = []
          with ThreadPoolExecutor(3) as ex:
              for r in ex.map(page, jobs): found += r
          seen, keep = set(), []
          for f in found:
              k = re.sub(r'\W', '', f['text'].lower())
              if k in seen: continue
              seen.add(k); keep.append(f)
          keep.sort(key=lambda x: len(x['text']))
          json.dump(keep, open('out/diyanet_hadisler.json', 'w'), ensure_ascii=False, indent=1)
          print('\nTARANAN SAYFA', len(jobs), 'SEÇİLEN', len(keep))
          for k in keep:
              print(f"- {k['text']}  ({k['source']} · Hadislerle İslâm {k['cilt']}/{k['sayfa']})")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diyanet-hadisler
          path: out
          retention-days: 14
