name: Diyanet hadis kaynağı (inceleme)

# Diyanet'in resmî hadis sitelerinin yapısını inceler (hangi sayfalar var, hadisler nasıl duruyor).
# Yalnız okur; sonuç diyanet-sayfalar paketinde. Uygulamaya bir şey eklemez.

on:
  workflow_dispatch:
  push:
    branches: [claude/charming-davinci-6c5fkr]
    paths:
      - .github/workflows/diyanet-arama.yml

jobs:
  incele:
    runs-on: ubuntu-latest
    steps:
      - name: Sayfaları indir
        run: |
          mkdir -p out
          python3 - <<'PY'
          import re, time, urllib.request
          def get(u):
              req = urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0 EzanSaati/1.0'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode('utf-8', 'replace')
          root = 'https://hadislerleislam.diyanet.gov.tr/sayfa.php'
          for cilt, sayfa in [(1, 372), (3, 200)]:
              html = get(f'{root}?CILT={cilt}&SAYFA={sayfa}')
              open(f'out/c{cilt}s{sayfa}.html', 'w').write(html)
              # Sayfa gezinti listesinden sonraki asıl içerik
              body = re.split(r'SAYFA=\d+"[^>]*>\s*\d+\s*</a>\s*(?:</[^>]+>\s*)*', html)[-1]
              body = re.sub(r'<(script|style)[^>]*>.*?</\1>', ' ', body, flags=re.S)
              main = html[:html.find('dipnotdiv')]
              k = main.rfind('post-content')
              print(f'\n===== CİLT {cilt} SAYFA {sayfa} — ANA METİN HTML')
              print(main[k:k+3000])
              time.sleep(1)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diyanet-sayfalar
          path: out
          retention-days: 7
