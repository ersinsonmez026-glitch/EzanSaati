name: Hadis listesi (Diyanet, Hadislerle İslâm)

# Diyanet İşleri Başkanlığı'nın "Hadislerle İslâm" eserinden (hadislerleislam.diyanet.gov.tr) hadisleri
# toplar: metin içinde Hz. Peygamber'in sözü olarak tırnakla verilen ve dipnotu Kütüb-i Sitte'yi (Buhârî,
# Müslim, Ebû Dâvûd, Tirmizî, Nesâî, İbn Mâce) gösteren sözler; her birinin eserdeki konu başlığıyla.
# Metin değiştirilmez. Sonuç diyanet-hadisler paketinde ve iş kaydında; uygulamaya eklenmez
# (önce gözden geçirilir).

on:
  workflow_dispatch:
  push:
    branches: [claude/charming-davinci-6c5fkr]
    paths:
      - .github/workflows/diyanet-arama.yml

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Hadisleri topla
        run: |
          mkdir -p out
          python3 - <<'PY'
          import html as H, json, re, time, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          SITE = 'https://hadislerleislam.diyanet.gov.tr/'
          ROOT = SITE + 'sayfa.php'
          def get(u):
              for i in range(4):
                  try:
                      req = urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0 EzanSaati/1.0'})
                      with urllib.request.urlopen(req, timeout=40) as r:
                          return r.read().decode('utf-8', 'replace')
                  except Exception:
                      time.sleep(3 + i * 5)
              print('alınamadı', u); return ''
          def plain(x):
              x = re.sub(r'<[^>]+>', '', x)
              return re.sub(r'\s+', ' ', H.unescape(x)).strip()

          # Konu başlıkları: içindekiler sayfasındaki bağlantılar (cilt, başlangıç sayfası, başlık)
          toc = {}
          idx = get(SITE + 'icindekiler.php')
          for c, p, t in re.findall(r'sayfa\.php\?CILT=(\d+)&(?:amp;)?SAYFA=(\d+)"[^>]*>(.*?)</a>', idx, re.S):
              t = re.sub(r'^\d+\s*\|\s*', '', plain(t))
              if t: toc.setdefault(int(c), []).append((int(p), t))
          for c in toc: toc[c].sort()
          print('konu sayısı', {c: len(v) for c, v in toc.items()})
          def topic(c, p):
              best = ''
              for start, t in toc.get(c, []):
                  if start <= p: best = t
              return best

          BOOKS = r'^(Buhârî|Müslim|Ebû Dâvûd|Tirmizî|Nesâî|İbn Mâce),'
          SPEAKER = r'(Peygamber|Resûl|Resul|Nebî|Efendimiz|Allah Elçisi)'
          def page(cv):
              cilt, sayfa = cv
              h = get(f'{ROOT}?CILT={cilt}&SAYFA={sayfa}')
              time.sleep(0.4)
              if 'dipnotdiv' not in h: return []
              main, notes = h.split('dipnotdiv', 1)
              src = {}
              for n, body in re.findall(r'<p>(\d+)\s*</font>\s*<font color="black">(.*?)</p>', notes, re.S):
                  src[n] = re.sub(r'^[A-ZİÜÖÇŞĞ]+\d+(/\d+)?\s+', '', plain(body))
              out = []
              for m in re.finditer(r'“([^“”]{15,700})”(.{0,160}?)<sup[^>]*>(\d+)</sup>', main, re.S):
                  quote, between, n = plain(m.group(1)), plain(m.group(2)), m.group(3)
                  source = re.sub(r'[.;:,]\s*$', '', src.get(n, '').strip())
                  if not re.search(BOOKS, source): continue
                  if len(between) > 60: continue
                  before = plain(main[max(0, m.start() - 600):m.start()])[-200:]
                  if not re.search(SPEAKER, before[-140:] + ' ' + between): continue
                  out.append({'text': quote, 'source': source, 'cilt': cilt, 'sayfa': sayfa,
                              'topic': topic(cilt, sayfa), 'before': before[-140:], 'after': between})
              return out
          jobs = []
          for cilt in range(1, 8):
              first = get(f'{ROOT}?CILT={cilt}&SAYFA=1')
              nums = re.findall(r'<option[^>]*>\s*(\d+)\s*</option>', first) + re.findall(r'SAYFA=(\d+)', first)
              last = max(int(x) for x in nums) if nums else 0
              print('cilt', cilt, 'sayfa', last)
              jobs += [(cilt, p) for p in range(1, last + 1)]
          found = []
          with ThreadPoolExecutor(3) as ex:
              for r in ex.map(page, jobs): found += r
          seen, keep = set(), []
          for f in found:
              k = re.sub(r'\W', '', f['text'].lower())
              if k in seen: continue
              seen.add(k); keep.append(f)
          json.dump(keep, open('out/diyanet_hadisler_tum.json', 'w'), ensure_ascii=False, indent=1)
          print('\nTARANAN SAYFA', len(jobs), 'BULUNAN', len(keep))
          for k in keep:
              print('#', json.dumps(k, ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: diyanet-hadisler
          path: out
          retention-days: 14
