name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Derleme türü (release, deneme ya da debug)'
        type: choice
        options: [release, deneme, debug]
        default: release

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Eksik platform dosyalarını tamamla
        run: flutter create --platforms=android .

      - name: Paketleri indir
        run: flutter pub get

      # Mağaza sürümü işlemci türüne göre ayrı APK'lara bölünür: her telefon yalnız kendine uygun olanı
      # kurar (arm64-v8a: günümüz telefonlarının neredeyse tamamı; armeabi-v7a: eski telefonlar).
      # Deneme sürümü: mağaza sürümüyle aynı (küçük ve hızlı), yalnız Premium deneme anahtarı açık;
      # günümüz telefonları için tek APK (arm64-v8a) yüklenir.
      - name: APK derle
        run: |
          case "${{ inputs.mode || 'release' }}" in
            debug)  flutter build apk --debug ;;
            deneme) flutter build apk --release --split-per-abi --dart-define=DENEME=true ;;
            *)      flutter build apk --release --split-per-abi ;;
          esac

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: EzanSaati-${{ inputs.mode == 'debug' && 'debug-' || inputs.mode == 'deneme' && 'deneme-' || '' }}apk
          path: build/app/outputs/flutter-apk/${{ inputs.mode == 'debug' && 'app-debug.apk' || inputs.mode == 'deneme' && 'app-arm64-v8a-release.apk' || 'app-*release.apk' }}
          retention-days: 14
