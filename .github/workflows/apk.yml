name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Derleme türü (release ya da debug)'
        type: choice
        options: [release, debug]
        default: release

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Eksik platform dosyalarını tamamla
        run: flutter create --platforms=android .

      - name: Paketleri indir
        run: flutter pub get

      # Mağaza sürümü işlemci türüne göre ayrı APK'lara bölünür: her telefon yalnız kendine uygun olanı
      # kurar (arm64-v8a: günümüz telefonlarının neredeyse tamamı; armeabi-v7a: eski telefonlar).
      - name: APK derle
        run: flutter build apk --${{ inputs.mode || 'release' }} ${{ (inputs.mode || 'release') == 'release' && '--split-per-abi' || '' }}

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: EzanSaati-${{ inputs.mode == 'debug' && 'debug-' || '' }}apk
          path: build/app/outputs/flutter-apk/app-*${{ inputs.mode || 'release' }}.apk
          retention-days: 14
