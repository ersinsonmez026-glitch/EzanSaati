name: Kısa sûrelerin ayet dosyaları kontrolü (geçici)

# Geçici: 78–114. sûrelerin tüm ayet dosyalarının (ve besmele kaydının) erişilebilir, çözülebilir ve
# boş olmadığını ölçer. Yalnızca log'a yazar; depoya hiçbir şey eklemez. İş bitince silinecek.
on:
  push:
    branches: [claude/charming-davinci-6c5fkr]
    paths: [.github/workflows/kuran-kisa-sure-kontrol.yml]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - shell: python
        run: |
          import json, subprocess, time, urllib.request
          UA = {'User-Agent': 'Mozilla/5.0 (EzanSaati research)'}
          meta = json.loads(urllib.request.urlopen(urllib.request.Request('https://api.alquran.cloud/v1/meta', headers=UA), timeout=60).read())['data']['surahs']['references']
          def dur(n):
              d = urllib.request.urlopen(urllib.request.Request(f'https://cdn.islamic.network/quran/audio/128/ar.alafasy/{n}.mp3', headers=UA), timeout=60).read()
              p = subprocess.run(['ffmpeg', '-v', 'error', '-i', 'pipe:0', '-ac', '1', '-ar', '8000', '-f', 's16le', 'pipe:1'], input=d, capture_output=True)
              return len(d), len(p.stdout) / 2 / 8000
          print('besmele #1:', dur(1))
          g = 0; start = {}
          for s in meta: start[s['number']] = g + 1; g += s['numberOfAyahs']
          print('toplam', g, '| 2:255 =', start[2] + 254, '| 114:6 =', start[114] + 5)
          bad, total = [], 0
          for s in meta[77:]:
              n0, cnt = start[s['number']], s['numberOfAyahs']
              ds = []
              for i in range(cnt):
                  try:
                      size, d = dur(n0 + i); ds.append(d); total += 1
                      if size < 2000 or d < 0.8: bad.append((s['number'], i + 1, size, d))
                  except Exception as e: bad.append((s['number'], i + 1, str(e)))
                  time.sleep(0.05)
              print(f"sûre {s['number']:3d} ({s['englishName']}): {cnt} ayet | {len(ds)} dosya çözüldü | ayet süresi {min(ds):.1f}–{max(ds):.1f} sn | toplam {sum(ds):.1f} sn")
          print('kontrol edilen ayet dosyası:', total, '| sorunlu:', bad)
