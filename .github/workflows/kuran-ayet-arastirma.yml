name: Kur'an ayet zamanlaması araştırması (geçici)

# Geçici: AlQuran Cloud API'sinde ayet bazlı ses/zaman kodu olup olmadığını ve sûre dosyasının
# ayet dosyalarıyla hizalanıp hizalanmadığını ölçer. Sonuçları yalnızca log'a yazar; depoya
# hiçbir şey eklemez, ses dosyaları runner'da geçici ölçüm için açılır. İş bitince silinecek.
on:
  push:
    branches: [claude/charming-davinci-6c5fkr]
    paths: [.github/workflows/kuran-ayet-arastirma.yml]

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Araçlar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q numpy
      - name: API ve belgeler
        shell: python
        run: |
          import json, re, time, html, urllib.request
          UA = {'User-Agent': 'Mozilla/5.0 (EzanSaati research; https://github.com/ersinsonmez026-glitch/EzanSaati)'}
          def get(u):
              time.sleep(1)
              return urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=60).read().decode('utf-8', 'replace')
          KW = re.compile(r'timing|timestamp|segment|start.?time|end.?time|duration|offset|sync|verse.?by.?verse|ayah.?audio|audio', re.I)
          for u in ['https://alquran.cloud/api', 'https://alquran.cloud/cdn', 'https://alquran.cloud/terms-and-conditions']:
              try: raw = get(u)
              except Exception as e: print('#####', u, 'HATA', e); continue
              t = html.unescape(re.sub(r'<script.*?</script>|<style.*?</style>', ' ', raw, flags=re.S))
              t = re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' \n ', t))
              hits = [s.strip()[:300] for s in re.split(r'(?<=[.!?])\s+| \n ', t) if KW.search(s)]
              print(f'\n##### {u} | eşleşme {len(hits)}')
              for h in dict.fromkeys(hits): print(' -', h)
              for m in sorted(set(re.findall(r'https?://cdn\.islamic\.network/[^\s"\'<>]+', raw))): print('  URL:', m)
          print('\n##### /v1/edition?format=audio (alafasy)')
          for e in json.loads(get('https://api.alquran.cloud/v1/edition?format=audio'))['data']:
              if 'alafasy' in e['identifier']: print(' ', e)
          for u in ['https://api.alquran.cloud/v1/ayah/1:1/ar.alafasy', 'https://api.alquran.cloud/v1/ayah/2:255/ar.alafasy']:
              print('\n#####', u); print(json.dumps(json.loads(get(u))['data'], ensure_ascii=False)[:1500])
          d = json.loads(get('https://api.alquran.cloud/v1/surah/36/ar.alafasy'))['data']
          print('\n##### /v1/surah/36/ar.alafasy anahtarlar:', list(d.keys()), '| ayet anahtarları:', list(d['ayahs'][0].keys()))
          print(json.dumps(d['ayahs'][0], ensure_ascii=False)[:800])
          raw = json.dumps(json.loads(get('https://api.alquran.cloud/v1/quran/ar.alafasy')))
          print('\n##### /v1/quran/ar.alafasy boyut', len(raw), '| zaman alanı geçiyor mu:', bool(re.search(r'timing|timestamp|segment|"start|"end|duration', raw, re.I)))
          for u in ['https://api.alquran.cloud/v1/timings/1/ar.alafasy', 'https://api.alquran.cloud/v1/surah/1/ar.alafasy/timings',
                    'https://api.alquran.cloud/v1/ayah/1:1/ar.alafasy/timings', 'https://api.alquran.cloud/v1/audio/timings']:
              try: print('#####', u, '->', get(u)[:300])
              except Exception as e: print('#####', u, '->', e)
      - name: Ayet dosyalarına erişim
        shell: python
        run: |
          import json, time, urllib.request
          UA = {'User-Agent': 'Mozilla/5.0 (EzanSaati research)'}
          meta = json.loads(urllib.request.urlopen(urllib.request.Request('https://api.alquran.cloud/v1/meta', headers=UA), timeout=60).read())['data']['surahs']['references']
          for br in (64, 128, 192):
              u = f'https://cdn.islamic.network/quran/audio/{br}/ar.alafasy/1.mp3'
              try: r = urllib.request.urlopen(urllib.request.Request(u, headers=UA, method='HEAD'), timeout=30); print(br, 'kbps', r.status, r.headers.get('Content-Length'))
              except Exception as e: print(br, 'kbps', e)
          g, bad, n = 0, [], 0
          for s in meta:
              first, last = g + 1, g + s['numberOfAyahs']; g = last
              for a in (first, last):
                  u = f'https://cdn.islamic.network/quran/audio/128/ar.alafasy/{a}.mp3'
                  try: urllib.request.urlopen(urllib.request.Request(u, headers=UA, method='HEAD'), timeout=30); n += 1
                  except Exception as e: bad.append((s['number'], a, str(e)))
                  time.sleep(0.15)
          print('toplam ayet', g, '| ilk/son ayet dosyası erişilebilir:', n, '| hata:', bad[:20])
      - name: Sûre dosyası = ayet dosyaları mı? (süre ve hizalama)
        shell: python
        run: |
          import json, subprocess, urllib.request, numpy as np
          UA = {'User-Agent': 'Mozilla/5.0 (EzanSaati research)'}
          def fetch(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=120).read()
          def pcm(data, sr=8000):
              p = subprocess.run(['ffmpeg', '-v', 'error', '-i', 'pipe:0', '-ac', '1', '-ar', str(sr), '-f', 's16le', 'pipe:1'], input=data, capture_output=True)
              return np.frombuffer(p.stdout, dtype=np.int16).astype(np.float32)
          meta = json.loads(fetch('https://api.alquran.cloud/v1/meta'))['data']['surahs']['references']
          start = {}; g = 0
          for s in meta: start[s['number']] = g + 1; g += s['numberOfAyahs']
          SR = 8000
          for sn in (1, 9, 36, 67, 97, 112, 114):
              cnt = meta[sn - 1]['numberOfAyahs']
              full = pcm(fetch(f'https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/{sn}.mp3'))
              ayahs = [pcm(fetch(f'https://cdn.islamic.network/quran/audio/128/ar.alafasy/{start[sn] + i}.mp3')) for i in range(cnt)]
              lens = [len(a) / SR for a in ayahs]
              print(f'\n##### Sûre {sn}: {cnt} ayet | sûre dosyası {len(full)/SR:.2f} sn | ayet toplamı {sum(lens):.2f} sn | fark {len(full)/SR - sum(lens):+.2f} sn')
              # Her ayetin ilk 2 sn'sini sûre dosyasında ara (tahmini konumun ±8 sn çevresi)
              est, drift = 0.0, []
              for i, a in enumerate(ayahs):
                  probe = a[:2 * SR]
                  if len(probe) < SR // 2: est += lens[i]; continue
                  lo = max(0, int((est - 8) * SR)); hi = min(len(full), int((est + 8) * SR) + len(probe))
                  seg = full[lo:hi]
                  if len(seg) < len(probe): print(f'  ayet {i+1}: sûre dosyasının dışında'); break
                  c = np.correlate(seg, probe, 'valid')
                  e = np.sqrt(np.convolve(seg ** 2, np.ones(len(probe)), 'valid')) * np.linalg.norm(probe) + 1e-9
                  k = int(np.argmax(c / e)); found = (lo + k) / SR; score = float((c / e)[k])
                  drift.append(found - est)
                  if i < 4 or i >= cnt - 2 or i % 20 == 0:
                      print(f'  ayet {i+1:3d}: tahmini {est:8.2f} | bulunan {found:8.2f} | kayma {found-est:+.2f} | benzerlik {score:.3f}')
                  est = found + lens[i]
              if drift: print(f'  kayma min {min(drift):+.2f} / maks {max(drift):+.2f} sn')
